    FormTemplatePropertyInputType:
      type: string
      enum:
        - TEXT
        - NUMERIC
        - DROPDOWN
        - FILE
      description: >
        Field type. Required when projectPropertyKey is not provided. TEXT = text input, NUMERIC = number input,
        DROPDOWN = single or multi-select (set multiple: true for multi-select), FILE = file attachment.
      title: FormTemplatePropertyInputType
    FormTemplatePropertyInputOptions:
      type: object
      properties: {}
      description: Field-type-specific configuration (e.g. dropdown choices).
      title: FormTemplatePropertyInputOptions
    FormTemplatePropertyInput:
      type: object
      properties:
        id:
          type: integer
          description: >
            ID of an existing field from a recent GET response. When provided without other fields (and without
            projectPropertyKey), the API carries forward the field's current name, type, isRequired, and all other
            attributes. Note: IDs change after every update — only use an id obtained from the most recent GET on this
            template.
        projectPropertyKey:
          type: string
          description: >
            The keyName of an existing project property. When provided, the API resolves the property and auto-populates
            all field attributes. All other fields on this object become optional overrides.
        name:
          type: string
          description: >-
            Field label. When projectPropertyKey is used, providing name overrides the property's display name on the
            form.
        type:
          $ref: '#/components/schemas/FormTemplatePropertyInputType'
          description: >
            Field type. Required when projectPropertyKey is not provided. TEXT = text input, NUMERIC = number input,
            DROPDOWN = single or multi-select (set multiple: true for multi-select), FILE = file attachment.
        isRequired:
          type: boolean
          description: Whether the field is required. Overrides the property default when projectPropertyKey is used.
        isReadOnly:
          type: boolean
          description: Whether the field is read-only. Overrides the property default when projectPropertyKey is used.
        multiple:
          type: boolean
          description: When true, allows multiple selections. Applicable to DROPDOWN fields.
        notes:
          type:
            - string
            - 'null'
          description: Helper text shown beneath the field.
        options:
          $ref: '#/components/schemas/FormTemplatePropertyInputOptions'
          description: Field-type-specific configuration (e.g. dropdown choices).
        referenceFileIds:
          type: array
          items:
            type: integer
          description: File IDs attached as reference documents to this field.
      description: |
        A single field inside a form group.

        **Using `projectPropertyKey` (recommended for project-linked fields)**

        When `projectPropertyKey` is provided, the API looks up the project property by its key
        and automatically fills in `name`, `type`, `isRequired`, `isReadOnly`, `multiple`, and `options`
        from the property definition. All other fields become optional overrides — for example, you can
        pass `isRequired: true` to override the property's default.

        Example — link to a project property by key:
        ```json
        { "projectPropertyKey": "sales_rep" }
        ```

        Example — link and override required:
        ```json
        { "projectPropertyKey": "sales_rep", "isRequired": true }
        ```

        **Manual field (no `projectPropertyKey`)**

        When `projectPropertyKey` is omitted, `type` is required and all other fields
        (name, isRequired, isReadOnly) should be provided explicitly.
      title: FormTemplatePropertyInput
    FormTemplateLayoutInput:
      type: object
      properties:
        id:
          type: integer
          description: >
            ID of an existing group from a recent GET response. When provided without other fields, the API carries
            forward the group's current name. Note: IDs change after every update — only use an id obtained from the
            most recent GET on this template.
        name:
          type:
            - string
            - 'null'
          description: Group title displayed above the fields.
        properties:
          type: array
          items:
            $ref: '#/components/schemas/FormTemplatePropertyInput'
          description: Ordered list of fields inside this group.
      description: A form group containing a title and an ordered list of field properties.
      title: FormTemplateLayoutInput
    FormTemplateUpdate:
      type: object
      properties:
        name:
          type: string
          description: Template name. Optional — omit to leave the existing name untouched.
        formLayouts:
          type: array
          items:
            $ref: '#/components/schemas/FormTemplateLayoutInput'
          description: >
            Optional. When provided, **fully replaces** all layout groups and their fields. Include existing groups with
            their `id` to keep/update them; omit the `id` for new groups. Groups not included are removed. Array order
            determines position.


            If omitted, the existing layout is left untouched.
        assigneeId:
          type:
            - integer
            - 'null'
          description: Direct user ID to assign. Mutually exclusive with `assigneeProperty` and `assigneeTeamId`.
        assigneeProperty:
          type:
            - string
            - 'null'
          description: >
            Property-based assignee. Use a standard key (`OWNER`, `SALES_REP`, `PROJECT_MANAGER`, `CREATED_BY`) or a
            custom PERSON property keyName. Mutually exclusive with `assigneeId` and `assigneeTeamId`.
        assigneeTeamId:
          type:
            - integer
            - 'null'
          description: >
            Assign a team: the team lead becomes the assignee and all other team members are added as collaborators.
            Mutually exclusive with `assigneeId` and `assigneeProperty`.
        collaborators:
          type: array
          items:
            type: integer
          description: Replaces the list of direct user collaborator IDs.
        collaboratorProperties:
          type: array
          items:
            type: string
          description: >
            Property-based collaborators. Each value is a standard key (`OWNER`, `SALES_REP`, `PROJECT_MANAGER`,
            `CREATED_BY`) or a custom PERSON property keyName.
        collaboratorTeamIds:
          type: array
          items:
            type: integer
          description: >
            Team IDs whose members are added as collaborators. Resolved to individual user IDs and merged (deduplicated)
            with any direct `collaborators` and members from `assigneeTeamId`.
        labels:
          type: array
          items:
            type: integer
          description: Replaces the list of label IDs applied to the template.
        dueDateXDaysAfter:
          type:
            - integer
            - 'null'
          description: Number of days after creation that the form is due.
      title: FormTemplateUpdate
