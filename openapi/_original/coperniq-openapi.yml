          description: >-
            The physical dimension this unit measures, if any. Null for packaging-style units (e.g. bundle, roll) that
            can't be used on a measurement.
        isCustom:
          type: boolean
          description: Whether this unit was defined by the company, as opposed to one of the seeded defaults.
        isArchived:
          type: boolean
          description: Whether this unit has been archived.
      required:
        - id
        - code
        - label
      description: >-
        A unit of measure from the company's unit registry (e.g. Each, Square Feet, Linear Feet). Referenced by catalog
        items and measurements via `unitId`.
      title: CatalogUnit
    MeasurementType:
      type: string
      enum:
        - MEASUREMENT
        - SUB_CALCULATION
      description: >-
        A plain MEASUREMENT is a raw input value; a SUB_CALCULATION ("sub-measurement") derives its value from a formula
        over other measurements.
      title: MeasurementType
    MeasurementFormulaOperandsItems:
      type: object
      properties:
        name:
          type: string
        measurementId:
          type: integer
      title: MeasurementFormulaOperandsItems
    MeasurementFormulaAst:
      type: object
      properties: {}
      description: Binary-operation AST node or leaf. See the formula description above.
      title: MeasurementFormulaAst
    MeasurementFormula:
      type: object
      properties:
        operands:
          type: array
          items:
            $ref: '#/components/schemas/MeasurementFormulaOperandsItems'
        ast:
          $ref: '#/components/schemas/MeasurementFormulaAst'
          description: Binary-operation AST node or leaf. See the formula description above.
        sourceText:
          type: string
          description: The formula as originally authored (e.g. "( m1 + m2 ) / 100")
      description: >
        The formula driving a SUB_CALCULATION measurement's quantity. Read-only — there is no API to create or edit a
        measurement's formula; it can only be authored in the app. Shape: `operands` names each referenced measurement
        (`{name, measurementId}`); `ast` is a binary-operation tree (`ADD`/`SUB`/`MUL`/`DIV`) whose leaves are either
        `{operandRef}` (referencing an entry in `operands` by name) or `{constant}` (a literal number); `sourceText` is
        the original formula text as authored.
      title: MeasurementFormula
    Measurement:
      type: object
      properties:
        id:
          type: integer
          description: Measurement identifier
        name:
          type: string
          description: Measurement name
        type:
          $ref: '#/components/schemas/MeasurementType'
          description: >-
            A plain MEASUREMENT is a raw input value; a SUB_CALCULATION ("sub-measurement") derives its value from a
            formula over other measurements.
        unit:
          oneOf:
            - $ref: '#/components/schemas/CatalogUnit'
            - type: 'null'
          description: The unit this measurement is expressed in, if any.
        minimumValue:
          type:
            - number
            - 'null'
          format: double
          description: Minimum allowed value. Only meaningful for type MEASUREMENT.
        formula:
          $ref: '#/components/schemas/MeasurementFormula'
        isArchived:
          type: boolean
          description: Whether this measurement has been archived.
      required:
        - id
        - name
        - type
      description: >
        A named measurement or sub-calculation that a catalog item can link to (via `measurementIds`) to drive its
        quantity. A "sub-measurement" is simply a Measurement with `type: SUB_CALCULATION` — not a separate structure.
      title: Measurement
    CatalogItemWasteFactorMode:
      type: string
      enum:
        - STATIC
      description: >-
        Waste factor mode applied when computing this item's quantity. Currently only STATIC is supported. Paired with
        wasteFactorValue — both are set, or neither.
      title: CatalogItemWasteFactorMode
    CatalogItem:
      type: object
      properties:
        id:
          type: integer
          description: Catalog item identifier
        name:
          type: string
          description: Catalog item name
        catalog:
          oneOf:
            - $ref: '#/components/schemas/TradeGroup'
            - type: 'null'
          description: High-level trade group for this item.
        type:
          $ref: '#/components/schemas/CatalogItemType'
          description: Catalog item type
        category:
          $ref: '#/components/schemas/CatalogCategoryCode'
          description: Catalog item category code (ProductCategory or ServiceCategory)
        manufacturer:
          type:
            - string
            - 'null'
          description: Catalog item manufacturer
        sku:
