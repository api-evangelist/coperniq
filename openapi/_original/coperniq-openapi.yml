  /ahjs:
    get:
      operationId: list-ahjs
      summary: List AHJs
      description: >
        Retrieve a paginated list of Authorities Having Jurisdiction (AHJs).


        Supports:

        - Pagination (`page_size`, `page`)

        - Sorting by name (`order_by`, default: asc)

        - Search by name or state code (`q`) — when `q` is exactly two characters it also matches the two-letter state
        code

        - Filter by `state` (two-letter code), `type`, and `country` (default: `US`)

        - Geo mode: pass `lat`+`lng` (together) to return every AHJ whose boundary covers the point — e.g. city, county,
        and state — ordered most-specific-first. Name/state/type filters are ignored, and an empty array is returned if
        none cover the point.


        Only active jurisdictions are returned. AHJs are seeded globally from the US Census TIGER catalog plus
        per-company private records. Most fields are read-only; only custom fields can be updated (see PATCH
        /ahjs/{id}).
      tags:
        - ahJs
      parameters:
        - name: page_size
          in: query
          description: Number of items per page (max 100)
          required: false
          schema:
            type: integer
            default: 20
        - name: page
          in: query
          description: Page number (1-based)
          required: false
          schema:
            type: integer
            default: 1
        - name: q
          in: query
          description: Search by AHJ name (case-insensitive). If exactly two characters, also matches the state code.
          required: false
          schema:
            type: string
        - name: state
          in: query
          description: Filter by two-letter state code (e.g. "CA").
          required: false
          schema:
            type: string
        - name: type
          in: query
          description: Filter by jurisdiction type.
          required: false
          schema:
            $ref: '#/components/schemas/AhjsGetParametersType'
        - name: country
          in: query
          description: Filter by country code.
          required: false
          schema:
            type: string
            default: US
        - name: order_by
          in: query
          description: Sort order for results
          required: false
          schema:
            $ref: '#/components/schemas/AhjsGetParametersOrderBy'
        - name: lat
          in: query
          description: Latitude in decimal degrees. Must be used together with `lng`.
          required: false
          schema:
            type: number
            format: double
        - name: lng
          in: query
          description: Longitude in decimal degrees. Must be used together with `lat`.
          required: false
          schema:
            type: number
            format: double
        - name: x-api-key
          in: header
          required: true
          schema:
            type: string
      responses:
        '200':
          description: List of AHJs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AHJ'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/List-ahjsRequestBadRequestError'
        '401':
          description: Authentication failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/List-ahjsRequestUnauthorizedError'
        '502':
          description: Bad gateway — an upstream service request failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/List-ahjsRequestBadGatewayError'
