            minimum: 1
            default: 1
        - name: order_by
          in: query
          description: Sort order for results
          required: false
          schema:
            $ref: '#/components/schemas/QuotesGetParametersOrderBy'
        - name: updated_after
          in: query
          description: >-
            Filter items updated after this timestamp (ISO 8601). Also matches records whose custom property values
            changed within the window.
          required: false
          schema:
            $ref: '#/components/schemas/QuotesGetParametersUpdatedAfter'
        - name: updated_before
          in: query
          description: >-
