    BillUpdateStatus:
      type: string
      enum:
        - SENT
        - PARTIALLY_PAID
        - PAID
      description: |
        Bill status (LINE_ITEMS bills only). Only valid when `issueDate` is also provided.
      title: BillUpdateStatus
    BillUpdate:
      type: object
      properties:
        lineItems:
          type: array
          items:
            $ref: '#/components/schemas/BillLineItemCreate'
          description: >-
            Flat array of line items (LINE_ITEMS bills only). May be combined with `sections` (a catalogItemId may
            appear only once across both).
        sections:
          type: array
          items:
            $ref: '#/components/schemas/BillSection'
          description: >-
            Grouped line items with named sections (LINE_ITEMS bills only). May be combined with `lineItems` (ungrouped
            items).
        percentage:
          type: number
          format: double
          description: Percentage value (PERCENTAGE bills only)
        dueDate:
          type: string
          format: date-time
          description: Due date (ISO 8601 datetime string)
        issueDate:
          type: string
          format: date-time
          description: |
            Issue date (LINE_ITEMS bills only). When provided, `status` must also be provided and must not be `DRAFT`.
        status:
          $ref: '#/components/schemas/BillUpdateStatus'
          description: |
            Bill status (LINE_ITEMS bills only). Only valid when `issueDate` is also provided.
        description:
          type:
            - string
            - 'null'
          description: Bill description
      description: >
        All fields are optional. `calculationMethod` cannot be changed after creation.


        **PERCENTAGE bills** — only `description`, `dueDate`, and `percentage` may be updated.


        **LINE_ITEMS bills** — `lineItems`, `sections`, or both may be updated (a `catalogItemId` may appear at most
        once across the flattened set). `issueDate` and `status` must be provided together; when `issueDate` is
        provided, `status` must be `SENT`, `PARTIALLY_PAID`, or `PAID`.
      title: BillUpdate
