      required:
        - id
      description: Checklist item update payload. Only fields provided are updated.
      title: ChecklistItemUpdate
    WorkOrderUpdate:
      type: object
      properties:
        title:
          type: string
        description:
          type: string
        priority:
          type: integer
        startDate:
          type: string
          format: date-time
        startDateAllDay:
          type: boolean
        endDate:
          type: string
          format: date-time
        endDateAllDay:
          type: boolean
        status:
          type: string
          description: Status label
        assigneeId:
          type: integer
          description: User identifier to assign to the work order
        collaborators:
          type: array
          items:
            type: integer
          description: User identifiers to assign as collaborators to the work order
        visits:
          type: array
          items:
            $ref: '#/components/schemas/VisitUpsert'
          description: >-
            Only applicable on field work orders. When provided, the `visits` array REPLACES the full set of visits for
            the work order. Include all existing visits you wish to keep or update (with their `id`), and include new
            visits without an `id`. Any existing visit not included in the request will be removed. Visit booleans
            default to false when omitted.
        checklist:
          type: array
          items:
            $ref: '#/components/schemas/ChecklistItemUpdate'
          description: >
            Update the checklist for the work order.

            When this field is provided, the `checklist` array REPLACES the full set of checklist items on the work
            order.

            - Include every existing item you want to keep or modify (identified by `id`). 

            - Any existing item NOT included in this array will be removed.

            - Each item MUST include an `id`. Items without an `id` are ignored (checklist item creation is not
            supported).
        isActive:
          type:
            - boolean
            - 'null'
          description: >-
            Set to `false` to archive the work order, or `true` to unarchive it. Applied independently of any other
            fields present in the same request.
      description: Payload for updating a work order. Supports partial updates.
      title: WorkOrderUpdate
