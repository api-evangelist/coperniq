    CatalogItemCreateType:
      type: string
      enum:
        - PRODUCT
        - SERVICE
      description: Catalog item type
      title: CatalogItemCreateType
    CatalogItemCreateWasteFactorMode:
      type: string
      enum:
        - STATIC
      description: Waste factor mode. Must be set together with wasteFactorValue — both, or neither.
      title: CatalogItemCreateWasteFactorMode
    CatalogItemCreate:
      type: object
      properties:
        name:
          type: string
          description: Catalog item name
        type:
          $ref: '#/components/schemas/CatalogItemCreateType'
          description: Catalog item type
        category:
          $ref: '#/components/schemas/CatalogCategoryCode'
          description: >-
            Catalog item category code. Must be a valid ProductCategory when type is PRODUCT or ServiceCategory when
            type is SERVICE.
        cost:
          type: number
          format: double
          minimum: 0
          description: Catalog item cost
        price:
          type: number
          format: double
          minimum: 0
          description: Catalog item price
        tradeGroup:
          $ref: '#/components/schemas/TradeGroup'
          description: >-
            High-level trade group for this item. If omitted, it is derived from the category — a product category
            resolves to the trade group it belongs to (for example ROOF_COVERING resolves to ENVELOPE), and services or
            category OTHER resolve to OTHER. When provided, it must be consistent with the category (for products, the
            category must belong to this trade group; category OTHER is allowed under any trade group).
        manufacturer:
          type:
            - string
            - 'null'
          description: Catalog item manufacturer
        sku:
          type:
            - string
            - 'null'
          description: Catalog item SKU
        code:
          type:
            - string
            - 'null'
          description: Catalog item code
        description:
          type:
            - string
            - 'null'
          description: Catalog item description
        preferredVendorId:
          type:
            - integer
            - 'null'
          description: ID of the preferred vendor (must be an existing active vendor for this company)
        unitId:
          type:
            - integer
            - 'null'
          description: >-
            ID of the unit this item is sold/measured in. Must reference a unit belonging to your company (see GET
            /catalog-units).
        measurementIds:
          type: array
          items:
            type: integer
          description: >-
            IDs of measurements (and/or a single sub-measurement) to link to this item, driving its quantity
            calculation. At most one linked measurement may be a sub-measurement (type SUB_CALCULATION), and it must be
            the only one linked. Multiple plain measurement links must share the same unit (or be unitless) — their
            values are summed.
        coverage:
          type:
            - number
            - 'null'
          format: double
          exclusiveMinimum: 0
          description: >-
            Measurement units covered per item unit. Must be greater than zero. Not compatible with a linked
            sub-calculation, which derives quantity from its own formula.
        wasteFactorMode:
          oneOf:
            - $ref: '#/components/schemas/CatalogItemCreateWasteFactorMode'
            - type: 'null'
          description: Waste factor mode. Must be set together with wasteFactorValue — both, or neither.
        wasteFactorValue:
          type:
            - number
            - 'null'
          format: double
          minimum: 0
          maximum: 100
          description: Waste factor percentage (0-100). Must be set together with wasteFactorMode.
      required:
        - name
        - type
        - category
        - cost
        - price
      title: CatalogItemCreate
