        '404':
          description: Resource not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetWorkflowRequestNotFoundError'
servers:
  - url: https://api.coperniq.io/v1
    description: Production server
components:
  schemas:
    ProjectsGetParametersOrderBy:
      type: string
      enum:
        - asc
        - desc
      default: asc
      title: ProjectsGetParametersOrderBy
    UserSummary:
      type: object
      properties:
        id:
          type: integer
        firstName:
          type:
            - string
            - 'null'
        lastName:
          type:
            - string
            - 'null'
        email:
          type:
            - string
            - 'null'
          format: email
        avatarUrl:
          type:
            - string
            - 'null'
      description: Minimal user representation used in responses
      title: UserSummary
    ProjectStatus:
      type: string
      enum:
        - ACTIVE
        - ON_HOLD
        - CANCELLED
        - COMPLETED
      description: |
        Status of the project:
        * `ACTIVE` - Project is active and in progress
        * `ON_HOLD` - Project is temporarily paused
        * `CANCELLED` - Project has been cancelled
        * `COMPLETED` - Project has been completed
      title: ProjectStatus
    ProjectStageSlaStatus:
      type: string
      enum:
        - VIOLATED
        - NON_VIOLATED
      description: Current SLA violation status
      title: ProjectStageSlaStatus
    ProjectStage:
      type: object
      properties:
        id:
          type: integer
          description: Stage identifier
        name:
          type: string
          description: Stage name
        type:
          type: string
          description: Stage type
        scope:
          type: string
          description: Stage scope
        redSla:
          type: integer
          description: Red SLA threshold in days
        yellowSla:
          type: integer
          description: Yellow SLA threshold in days
        timeInStageDays:
          type: integer
          description: Number of days in current stage
        slaStatus:
          $ref: '#/components/schemas/ProjectStageSlaStatus'
          description: Current SLA violation status
      description: |
        Current stage information (Workflows 1.0).

        This object is present only for records still using the original Stage-based workflow engine.
        When the project is managed by Workflows 2.0 (Phase engine) the `stage` object and
        related fields (`stageId`, `timeInStageDays`, `slaStatus`) are omitted.
      title: ProjectStage
    ProjectPhaseSlaStatus:
      type: string
      enum:
        - VIOLATED
        - NON_VIOLATED
      description: Current SLA violation status for the phase
      title: ProjectPhaseSlaStatus
    ProjectPhase:
      type: object
      properties:
        instanceId:
          type: integer
          description: Phase instance identifier
        templateId:
          type: integer
          description: Phase template identifier
        name:
          type: string
          description: Phase name
        status:
          type: string
          description: Current phase status
        type:
          type: string
          description: Phase type
        redSla:
          type: integer
          description: Red SLA threshold in days (from template)
        yellowSla:
          type: integer
          description: Yellow SLA threshold in days (from template)
        timeInStageDays:
          type: integer
          description: Number of days in current phase (mirrors `timeInStageDays` metric)
        slaStatus:
          $ref: '#/components/schemas/ProjectPhaseSlaStatus'
          description: Current SLA violation status for the phase
      description: |
        Current phase information (Workflows 2.0).

        This object replaces `stage` when a project is attached to the Phase-based workflow engine.
        If the project is still on Workflows 1.0 this object will be omitted.
      title: ProjectPhase
    Project:
      type: object
      properties:
        id:
          type: integer
          description: Unique identifier
        createdAt:
          type: string
          format: date-time
          description: Creation timestamp
        updatedAt:
          type: string
          format: date-time
          description: Last update timestamp
        title:
          type: string
          description: Record title/name
        description:
          type:
            - string
            - 'null'
          description: Record description
        address:
          type: array
          items:
            type: string
          description: Record location/address
        isActive:
          type: boolean
          description: Whether the record is active
        primaryEmail:
          type:
            - string
            - 'null'
          format: email
          description: Primary contact email
        primaryPhone:
          type:
            - string
            - 'null'
          description: Primary contact phone
        number:
          type: integer
          description: Record number (e.g., 1234)
        createdBy:
          oneOf:
            - $ref: '#/components/schemas/UserSummary'
            - type: 'null'
          description: >-
            User who created the record. Null when the record was created by a non-user actor (e.g. automation or a
            contact).
        updatedBy:
          oneOf:
            - $ref: '#/components/schemas/UserSummary'
            - type: 'null'
          description: >-
            User who last edited a field on the record, derived from the changelog. Null when the record has never been
            edited or the last edit was made by a non-user actor.
        custom:
          type: object
          additionalProperties:
            description: Any type
          description: Custom fields
        trades:
          type: array
          items:
            type: string
          description: Array of trade types
        value:
          type:
            - number
            - 'null'
          format: double
          description: Project value
        size:
          type:
            - number
            - 'null'
          format: double
          description: Project size
        workflowId:
          type:
            - integer
            - 'null'
          description: Associated workflow ID
        accountId:
          type:
            - integer
            - 'null'
          description: Associated account ID
        status:
          $ref: '#/components/schemas/ProjectStatus'
        stage:
          $ref: '#/components/schemas/ProjectStage'
          description: |
            Current stage information (Workflows 1.0).

            This object is present only for records still using the original Stage-based workflow engine.
            When the project is managed by Workflows 2.0 (Phase engine) the `stage` object and
            related fields (`stageId`, `timeInStageDays`, `slaStatus`) are omitted.
        phase:
          $ref: '#/components/schemas/ProjectPhase'
          description: |
            Current phase information (Workflows 2.0).

            This object replaces `stage` when a project is attached to the Phase-based workflow engine.
            If the project is still on Workflows 1.0 this object will be omitted.
        workflowName:
          type: string
          description: |
            Name of the associated workflow.
      title: Project
    ProjectsGetResponsesContentApplicationJsonSchemaCode:
      type: string
      enum:
        - UNAUTHORIZED
      title: ProjectsGetResponsesContentApplicationJsonSchemaCode
    ListProjectsRequestUnauthorizedError:
      type: object
      properties:
        message:
          type: string
        code:
          $ref: '#/components/schemas/ProjectsGetResponsesContentApplicationJsonSchemaCode'
      title: ListProjectsRequestUnauthorizedError
    ProjectsSearchGetParametersOp1:
      type: string
      enum:
        - eq
        - neq
        - gt
        - gte
        - lt
        - lte
        - contains
        - in
