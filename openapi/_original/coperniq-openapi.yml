    patch:
      operationId: files_updateFile
      summary: Update File
      description: >
        Rename, archive/unarchive, and/or move a file. Moving isn't a separate operation — set `folderId` and/or
        `phaseInstanceId` in the same request.


        Notes:

        - All fields are optional; only fields present in the request body are applied.

        - `folderId` accepts `null` to un-file (remove from its current folder).

        - The target folder must belong to the same project as the file.

        - A file sits in either a folder or the root of a phase, never both. Setting `phaseInstanceId` clears `folderId`
        (and vice versa) unless you explicitly set both in the same request, which is rejected with `400`.
