      oneOf:
        - type: object
          properties:
            type:
              type: string
              enum:
                - phase
              description: 'Discriminator value: phase'
            id:
              type: integer
              description: Phase instance identifier
            name:
              type: string
              description: Phase name
            position:
              type: integer
              description: Phase's position in the project's workflow
            status:
              type: string
              description: Phase status
            phaseTemplateId:
              type: integer
              description: Phase template this instance was created from
            projectId:
              type: integer
              description: Project this phase belongs to
            createdAt:
              type:
                - string
                - 'null'
              format: date-time
              description: Creation timestamp
            updatedAt:
              type:
                - string
                - 'null'
              format: date-time
              description: Last update timestamp
          required:
            - type
            - id
            - name
            - position
            - status
            - phaseTemplateId
            - projectId
          description: >-
            A virtual "folder" row synthesized from a workflow phase — not a real Folder database record. Use its `id`
            as `phase_instance_id` on GET /phases/{phase_instance_id}/contents.
        - type: object
          properties:
            type:
              $ref: '#/components/schemas/FolderListItemType'
            id:
              type: integer
              description: Folder identifier
            name:
              type: string
              description: Folder name
            companyId:
              type: integer
              description: Owning company identifier
            projectId:
              type: integer
              description: Project (or opportunity/account, under the hood) this folder belongs to
            parentId:
              type:
                - integer
                - 'null'
              description: >-
                Parent folder id, if this folder is nested under another folder. Mutually exclusive with
                `phaseInstanceId`. Folders nest at most 2 levels deep.
            phaseInstanceId:
              type:
                - integer
                - 'null'
              description: Phase instance id, if this folder sits at the root of a phase. Mutually exclusive with `parentId`.
            isActive:
              type: boolean
              description: Whether the folder is active (false if archived)
            createdBy:
              type:
                - integer
                - 'null'
              description: User who created the folder
            createdAt:
              type: string
              format: date-time
              description: Creation timestamp
            updatedAt:
              type: string
              format: date-time
              description: Last update timestamp
          required:
            - type
            - id
            - name
            - projectId
            - isActive
            - createdAt
            - updatedAt
          description: A real doc folder, as returned by GET /projects/{project_id}/folders.
      discriminator:
        propertyName: type
      description: >-
        One row from GET /projects/{project_id}/folders or GET /opportunities/{opportunity_id}/folders — either a phase
