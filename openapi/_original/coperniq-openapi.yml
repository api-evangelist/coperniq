    get:
      operationId: calls_listCalls
      summary: List Calls
      description: |
        Retrieve a paginated list of calls across your whole company, including calls logged on
        projects, opportunities and accounts. Each call has `projectId`, `opportunityId` or
        `accountId` set to the record it's logged on (all three are `null` for calls not yet
        linked to a record).

        Supports:
        - Pagination (`page_size`, `page`)
        - Date filtering (`updated_after`, `updated_before`)
        - Filtering by `outcome`, `reason` and `disposition`
        - Sorting by creation time (`order_by`, newest first by default)
      tags:
        - calls
      parameters:
        - name: page_size
          in: query
          description: Number of items per page (max 100)
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: page
          in: query
          description: Page number (1-based)
          required: false
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: updated_after
          in: query
          description: >-
            Filter items updated after this timestamp (ISO 8601). Also matches records whose custom property values
            changed within the window.
          required: false
          schema:
            $ref: '#/components/schemas/CallsGetParametersUpdatedAfter'
        - name: updated_before
          in: query
          description: >-
            Filter items updated before this timestamp (ISO 8601). Also matches records whose custom property values
            changed within the window.
          required: false
          schema:
            $ref: '#/components/schemas/CallsGetParametersUpdatedBefore'
        - name: order_by
          in: query
          description: Sort by creation time. Defaults to newest first.
          required: false
          schema:
            $ref: '#/components/schemas/CallsGetParametersOrderBy'
        - name: outcome
          in: query
          description: Only return calls with this outcome
          required: false
          schema:
            $ref: '#/components/schemas/CallsGetParametersOutcome'
        - name: reason
          in: query
          description: Only return calls with exactly this reason (see `GET /calls/classification-options`)
          required: false
          schema:
            type: string
            maxLength: 255
        - name: disposition
          in: query
          description: Only return calls with exactly this disposition (see `GET /calls/classification-options`)
          required: false
          schema:
            type: string
            maxLength: 255
      responses:
        '200':
          description: List of calls
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CallListItem'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListCallsRequestBadRequestError'
        '401':
          description: Authentication failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListCallsRequestUnauthorizedError'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListCallsRequestInternalServerError'
        '502':
          description: Bad Gateway — downstream GraphQL service returned errors
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListCallsRequestBadGatewayError'
      security:
        - ApiKeyAuth: []
