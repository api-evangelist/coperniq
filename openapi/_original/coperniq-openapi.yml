  /accounts/search:
    get:
      operationId: search-accounts
      summary: Search Accounts
      description: >
        Search accounts using up to two filters (prop1/op1/value1 and optionally prop2/op2/value2), combined with
        `logic` (AND/OR).


        Properties:

        - `propX` can be a standard field (e.g., `status`, `title`, `city`, `type`, `accountId`, etc.) or a custom
        property key name.

        - Use the `property key` from your company settings.

        - Filter by parent account with `accountId`. `clientId` is accepted as a deprecated alias for backwards
        compatibility.


        Operators (`opX`):

        - Equality: `eq`, `neq`

        - Numeric/datetime comparisons: `gt`, `gte`, `lt`, `lte`

        - Text/string matching: `contains` (case-insensitive)

        - Lists: `in`, `nin` (CSV list in `valueX`)

        - Ranges: `between` (use `valueX` as `from,to`)

        - Existence: `exists` is not supported for custom properties due to performance limitations. Use `eq` or `neq`
        instead.


        Value formats:

        - `in`/`nin`: lists can be provided as:
          - Plain CSV: `value1=OPEN,ACTIVE`
          - Quoted CSV (to include commas inside a value): `value1="Last, First",Other`
          - JSON array: `value1=["Last, First","Other"]`
        - `between`: `from,to` (e.g., `value1=2025-01-01,2025-12-31` or `value1=10,20`)

        - Dates should be ISO 8601 strings; numeric-like values on custom properties are matched against both numeric
        and text representations.


        Examples:

        - status equals ACTIVE: `?prop1=status&op1=eq&value1=ACTIVE`

        - custom id equals 1234: `?prop1=legacy_tool_project_id&op1=eq&value1=1234`

        - title contains "Solar": `?prop1=name&op1=contains&value1=Solar`

        - status IN (ACTIVE, ON_HOLD) AND city = Austin:
        `?prop1=status&op1=in&value1=ACTIVE,ON_HOLD&logic=and&prop2=city&op2=eq&value2=Austin`


        **Note:** The `/clients` path is an alias for `/accounts` and will continue to work until users are individually
        notified and migrated.
      tags:
        - accounts
      parameters:
        - name: prop1
          in: query
          description: First field to filter (standard or custom keyName)
          required: true
          schema:
            type: string
        - name: op1
          in: query
          description: Operator for prop1
          required: true
          schema:
            $ref: '#/components/schemas/AccountsSearchGetParametersOp1'
        - name: value1
          in: query
          description: Value for prop1 (comma-separated values for in/nin or between)
          required: true
          schema:
            type: string
        - name: logic
          in: query
          description: Logical combination when both prop1 and prop2 are provided
          required: false
          schema:
            $ref: '#/components/schemas/AccountsSearchGetParametersLogic'
        - name: prop2
          in: query
          description: Optional second field to filter
          required: false
          schema:
            type: string
        - name: op2
          in: query
          description: Operator for prop2
          required: false
          schema:
            $ref: '#/components/schemas/AccountsSearchGetParametersOp2'
        - name: value2
          in: query
          description: Value for prop2 (comma-separated values for in/nin or between)
          required: false
          schema:
            type: string
        - name: page_size
          in: query
          description: Number of items per page (max 100)
          required: false
          schema:
            type: integer
            default: 20
        - name: page
          in: query
          description: Page number (1-based)
          required: false
          schema:
            type: integer
            default: 1
        - name: order_by
          in: query
          description: Sort order for results
          required: false
          schema:
            $ref: '#/components/schemas/AccountsSearchGetParametersOrderBy'
        - name: include_archived
          in: query
          description: Whether to include archived (inactive) records in the response. By default only active records are returned.
          required: false
          schema:
            type: boolean
            default: false
        - name: x-api-key
          in: header
          required: true
          schema:
            type: string
      responses:
        '200':
          description: List of accounts matching filters
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Account'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SearchAccountsRequestBadRequestError'
        '401':
          description: Authentication failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SearchAccountsRequestUnauthorizedError'
