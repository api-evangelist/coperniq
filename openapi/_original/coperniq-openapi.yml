  /timesheets:
    get:
      operationId: timesheets_list-timesheets
      summary: List Timesheets
      description: >
        Retrieve a paginated list of timesheets (time entries).


        Supports:

        - Pagination (`page_size`, `page`)

        - Sorting by last updated (`order_by`, default: desc)

        - Filter by `project_id` / `account_id` / `opportunity_id` (aliases — projects, accounts, and opportunities
        share the same underlying record), `work_order_id`, `user_id`, and `type`

        - Filter by the entry's own date range (`start_date`, `end_date`) or by last-updated time (`updated_after`,
        `updated_before`)


        Archived timesheets are excluded unless `include_archived=true` is passed.
      tags:
        - timesheets
      parameters:
        - name: page_size
          in: query
          description: Number of items per page (max 100)
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: page
          in: query
          description: Page number (1-based)
          required: false
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: order_by
          in: query
          description: Sort order for results
          required: false
          schema:
            $ref: '#/components/schemas/TimesheetsGetParametersOrderBy'
        - name: project_id
          in: query
          description: Filter by project ID. Alias of account_id/opportunity_id.
          required: false
          schema:
            type: integer
        - name: account_id
          in: query
          description: Filter by account ID. Alias of project_id/opportunity_id.
          required: false
          schema:
            type: integer
        - name: opportunity_id
          in: query
          description: Filter by opportunity ID. Alias of project_id/account_id.
          required: false
          schema:
            type: integer
        - name: work_order_id
          in: query
          description: Filter by work order ID.
          required: false
          schema:
            type: integer
        - name: user_id
          in: query
          description: Filter by the worker the time entry is logged for.
          required: false
          schema:
            type: integer
        - name: type
          in: query
          description: Filter by time entry type.
          required: false
          schema:
            $ref: '#/components/schemas/TimesheetsGetParametersType'
        - name: status
          in: query
          description: Filter by processing status.
          required: false
          schema:
            $ref: '#/components/schemas/TimesheetsGetParametersStatus'
        - name: include_archived
          in: query
          description: Include archived timesheets in the results.
          required: false
          schema:
            type: boolean
            default: false
        - name: start_date
          in: query
          description: Only return timesheets whose start time is at or after this timestamp.
          required: false
          schema:
            type: string
            format: date-time
        - name: end_date
          in: query
          description: Only return timesheets whose end time is at or before this timestamp.
          required: false
          schema:
            type: string
            format: date-time
        - name: updated_after
          in: query
          description: >-
            Filter items updated after this timestamp (ISO 8601). Also matches records whose custom property values
            changed within the window.
          required: false
          schema:
            $ref: '#/components/schemas/TimesheetsGetParametersUpdatedAfter'
        - name: updated_before
          in: query
          description: >-
            Filter items updated before this timestamp (ISO 8601). Also matches records whose custom property values
            changed within the window.
          required: false
          schema:
            $ref: '#/components/schemas/TimesheetsGetParametersUpdatedBefore'
      responses:
        '200':
          description: List of timesheets
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Timesheet'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/List-timesheetsRequestBadRequestError'
        '401':
          description: Authentication failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/List-timesheetsRequestUnauthorizedError'
        '502':
          description: Bad gateway — an upstream service request failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/List-timesheetsRequestBadGatewayError'
      security:
        - ApiKeyAuth: []
