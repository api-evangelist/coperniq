components:
  schemas:
    ProjectsGetParametersUpdatedAfter:
      oneOf:
        - type: string
          format: date
        - type: string
          format: date-time
      title: ProjectsGetParametersUpdatedAfter
    ProjectsGetParametersUpdatedBefore:
      oneOf:
        - type: string
          format: date
        - type: string
          format: date-time
      title: ProjectsGetParametersUpdatedBefore
    ProjectsGetParametersOrderBy:
      type: string
      enum:
        - asc
        - desc
      default: asc
      title: ProjectsGetParametersOrderBy
    UserSummary:
      type: object
      properties:
        id:
          type: integer
        firstName:
          type:
            - string
            - 'null'
        lastName:
          type:
            - string
            - 'null'
        email:
          type:
            - string
            - 'null'
          format: email
        avatarUrl:
          type:
            - string
            - 'null'
      description: Minimal user representation used in responses
      title: UserSummary
    TradeType:
      type: string
      enum:
        - EV Charger
        - Solar
        - Storage
        - Boiler
        - Chiller
        - Ductwork
        - HVAC
        - Refrigeration
        - Electrical
        - Generator
        - Lighting
        - Gas Line
        - Plumbing
        - Water Filtration
        - Water Heater
        - Communications
        - Electronic Safety & Security
        - Integrated Automation
        - Insulation
        - Gutters
        - Roofing
        - Siding
        - Windows
        - Drywall
        - General Contracting
        - Home Improvement
        - Landscaping
        - R&R (Remove & Reinstall)
        - Tenant Improvement
        - Tree Cutting
      description: >-
        Trade type. Matching is case-insensitive on input. `D&R` and `R&R (Repair and Renovation)` are accepted as
        legacy aliases and normalized to `R&R (Remove & Reinstall)`.
      title: TradeType
    ProjectStatus:
      type: string
      enum:
        - ACTIVE
        - ON_HOLD
        - CANCELLED
        - COMPLETED
      description: |
        Status of the project:
        * `ACTIVE` - Project is active and in progress
        * `ON_HOLD` - Project is temporarily paused
        * `CANCELLED` - Project has been cancelled
        * `COMPLETED` - Project has been completed
      title: ProjectStatus
    ProjectStageSlaStatus:
      type: string
      enum:
        - VIOLATED
        - NON_VIOLATED
      description: Current SLA violation status
      title: ProjectStageSlaStatus
    ProjectStage:
      type: object
      properties:
        id:
          type: integer
          description: Stage identifier
        name:
          type: string
          description: Stage name
        type:
          type: string
          description: Stage type
        scope:
          type: string
          description: Stage scope
        redSla:
          type: integer
          description: Red SLA threshold in days
        yellowSla:
          type: integer
          description: Yellow SLA threshold in days
        timeInStageDays:
          type: integer
          description: Number of days in current stage
        slaStatus:
          $ref: '#/components/schemas/ProjectStageSlaStatus'
          description: Current SLA violation status
      description: |
        Current stage information (Workflows 1.0).

        This object is present only for records still using the original Stage-based workflow engine.
        When the project is managed by Workflows 2.0 (Phase engine) the `stage` object and
        related fields (`stageId`, `timeInStageDays`, `slaStatus`) are omitted.
      title: ProjectStage
    ProjectPhaseSlaStatus:
      type: string
      enum:
        - VIOLATED
        - NON_VIOLATED
      description: Current SLA violation status for the phase
      title: ProjectPhaseSlaStatus
    ProjectPhase:
      type: object
      properties:
        instanceId:
          type: integer
          description: Phase instance identifier
        templateId:
          type: integer
          description: Phase template identifier
        name:
          type: string
          description: Phase name
        status:
          type: string
          description: Current phase status
        type:
          type: string
          description: Phase type
        redSla:
          type: integer
          description: Red SLA threshold in days (from template)
        yellowSla:
          type: integer
          description: Yellow SLA threshold in days (from template)
        timeInStageDays:
          type: integer
          description: Number of days in current phase (mirrors `timeInStageDays` metric)
        slaStatus:
          $ref: '#/components/schemas/ProjectPhaseSlaStatus'
          description: Current SLA violation status for the phase
      description: |
        Current phase information (Workflows 2.0).

        This object replaces `stage` when a project is attached to the Phase-based workflow engine.
        If the project is still on Workflows 1.0 this object will be omitted.
        Only populated on GET (list, search, get by id) — omitted on create/update responses.
      title: ProjectPhase
    ProjectPhaseTimelineItems:
      type: object
      properties:
        phaseTemplateId:
          type: integer
        startedAt:
          type:
            - string
            - 'null'
          format: date-time
          description: Timestamp when the project entered this phase template
        completedAt:
          type:
            - string
            - 'null'
          format: date-time
          description: Timestamp when the project exited this phase template
      title: ProjectPhaseTimelineItems
    ContactRef:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        title:
          type:
            - string
            - 'null'
          description: Contact title (e.g. job title)
        description:
          type:
            - string
            - 'null'
        emails:
          type: array
          items:
            type: string
        phones:
          type: array
          items:
            type: string
        isPrimary:
          type: boolean
          description: True for the primary contact (the first contact in the list). At most one contact is primary.
      title: ContactRef
    Project:
      type: object
      properties:
        id:
          type: integer
          description: Unique identifier
        createdAt:
          type: string
          format: date-time
          description: Creation timestamp
        updatedAt:
          type: string
          format: date-time
          description: Timestamp of the most recent update to the record, including changes to its custom property values.
        title:
          type: string
          description: Record title/name
        description:
          type:
            - string
            - 'null'
          description: Record description
        address:
          type: array
          items:
            type: string
          description: Record location/address
        isActive:
          type: boolean
          description: Whether the record is active
        primaryEmail:
          type:
            - string
            - 'null'
          format: email
          description: Primary contact email
        primaryPhone:
          type:
            - string
            - 'null'
          description: Primary contact phone
        number:
          type: integer
          description: Record number (e.g., 1234)
        createdBy:
          oneOf:
            - $ref: '#/components/schemas/UserSummary'
            - type: 'null'
          description: >-
            User who created the record. Null when the record was created by a non-user actor (e.g. automation or a
            contact).
        updatedBy:
          oneOf:
            - $ref: '#/components/schemas/UserSummary'
            - type: 'null'
          description: >-
            User who last edited a field on the record, derived from the changelog. Null when the record has never been
            edited or the last edit was made by a non-user actor.
        custom:
          type: object
          additionalProperties:
            description: Any type
          description: Custom fields
        trades:
          type: array
          items:
            $ref: '#/components/schemas/TradeType'
          description: Array of trade types
        value:
          type:
            - number
            - 'null'
          format: double
          description: Project value
        size:
          type:
            - number
            - 'null'
          format: double
          description: Project size
        workflowId:
          type:
            - integer
            - 'null'
          description: Associated workflow ID
        accountId:
          type:
            - integer
            - 'null'
          description: Associated account ID
        status:
          $ref: '#/components/schemas/ProjectStatus'
        stage:
          $ref: '#/components/schemas/ProjectStage'
          description: |
            Current stage information (Workflows 1.0).

            This object is present only for records still using the original Stage-based workflow engine.
            When the project is managed by Workflows 2.0 (Phase engine) the `stage` object and
            related fields (`stageId`, `timeInStageDays`, `slaStatus`) are omitted.
        phase:
          $ref: '#/components/schemas/ProjectPhase'
          description: |
            Current phase information (Workflows 2.0).

            This object replaces `stage` when a project is attached to the Phase-based workflow engine.
            If the project is still on Workflows 1.0 this object will be omitted.
            Only populated on GET (list, search, get by id) — omitted on create/update responses.
        phaseTimeline:
          type: array
          items:
            $ref: '#/components/schemas/ProjectPhaseTimelineItems'
          description: >
            Only present on `GET /projects` and `/projects/search` when `entered_phase_id`/`exited_phase_id` is used to
            filter the results. Contains the project's full phase-transition history (not just the matched phase) in
            compact form — use `GET /projects/{project_id}` for the complete `phaseInstances` with names, positions, and
            SLA info.
        lineItemsUpdatedAt:
          type:
            - string
            - 'null'
          format: date-time
          description: >
            Only present on `GET /projects` and `/projects/search` when `include_line_item_updates=true` is passed
            together with `updated_after` and/or `updated_before`. The most recent `updatedAt` among the project's own
            scope line items (estimate/scope items; line items on quotes/invoices are excluded). `null` if the project
            has no scope line items. Useful for telling whether a row matched the date window via its own `updatedAt` or
            via a line item edit.
        workflowName:
          type: string
          description: |
            Name of the associated workflow.
        contacts:
          type: array
          items:
            $ref: '#/components/schemas/ContactRef'
          description: >-
            Contacts associated with this project (independent of, and not inherited from, the parent account's
            contacts). Set on create or update via the `contacts` request field. On GET requests, only populated when
            include_contacts=true is passed. Always populated on POST (create) and PATCH (update) responses. Ordered
            with the primary contact first, capped at 20 contacts.
      title: Project
    ProjectsGetResponsesContentApplicationJsonSchemaCode:
      type: string
      enum:
        - UNAUTHORIZED
      title: ProjectsGetResponsesContentApplicationJsonSchemaCode
