    NoteCreate:
      type: object
      properties:
        body:
          type: string
          description: >
            Note text content.


            To mention (@) a user, team, or AI agent, embed a mention token directly in the body string using the format
            `[Display Name|~id:USER_ID]`. The display-name portion is cosmetic; the trailing token is what drives the
            mention. A valid mention creates a feed notification (and downstream channels) for the mentioned
            recipient(s).


            Supported tokens:

            - User: `[Display Name|~id:USER_ID]` — e.g. `Please review [Nicolaus Copernicus|~id:99001]`

            - Team: `[Team Name|~team:TEAM_ID]` — notifies all team members

            - AI agent: `[Name|~agent:slug]`


            Note: the author is excluded from their own mention notifications, so mentioning the same user the API key
            authenticates as will not fire a notification. Mention a different user to test.
        replyToId:
          type: integer
          description: >-
            ID of the parent note to reply to. When provided, the new note is created as a threaded reply under the
            specified note.
      required:
        - body
      title: NoteCreate
    NoteCreateResponse:
      type: object
      properties:
        id:
          type: integer
          description: Note identifier
        note:
          type: string
          description: Note text content
        createdAt:
          type: string
          format: date-time
          description: Creation timestamp
        updatedAt:
          type: string
          format: date-time
          description: Last update timestamp
      required:
        - id
        - note
        - createdAt
        - updatedAt
      description: >-
        Response returned when a note is created. Does not include author details; retrieve them from the corresponding
        note list endpoint (e.g., GET `/projects/{projectId}/notes` or GET `/accounts/{accountId}/notes`).
      title: NoteCreateResponse
