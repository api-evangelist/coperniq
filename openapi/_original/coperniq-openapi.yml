          items:
            $ref: '#/components/schemas/InvoiceLineItemCreate'
          description: >-
            Flat array of line items (LINE_ITEMS only). May be combined with `sections` (a catalogItemId may appear only
            once across both).
        sections:
          type: array
          items:
            $ref: '#/components/schemas/InvoiceSection'
          description: >-
            Grouped line items with named sections (LINE_ITEMS only). May be combined with `lineItems` (ungrouped
            items).
        percentage:
          type: number
          format: double
          minimum: 0
          description: Percentage (PERCENTAGE invoices only). Cannot be combined with `lineItems` or `sections`.
        issueDate:
          type: string
          format: date-time
          description: Issue date (ISO 8601 datetime string)
        dueDate:
          type: string
          format: date-time
          description: Due date (ISO 8601 datetime string)
        description:
          type:
            - string
            - 'null'
          description: Invoice description
        isActive:
          type: boolean
          description: >-
            Set to `false` to archive the invoice, or `true` to unarchive it. Applied independently of any other fields
            present in the same request.
      description: >
        All fields are optional. When updating line items, provide `lineItems`, `sections`, or both. A `catalogItemId`
        may appear at most once across the flattened set.

        `calculationMethod` cannot be changed after creation and is not accepted on update. `percentage` (PERCENTAGE
        invoices) cannot be combined with `lineItems` or `sections` (LINE_ITEMS invoices).
      title: InvoiceUpdate
