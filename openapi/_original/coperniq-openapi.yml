  /form-templates/{form_template_id}:
    get:
      operationId: formTemplates_getFormTemplateById
      summary: Get Form Template
      description: |
        Retrieve a specific form template by ID, including its full field layout.
      tags:
        - formTemplates
      parameters:
        - name: form_template_id
          in: path
          description: Form template identifier
          required: true
