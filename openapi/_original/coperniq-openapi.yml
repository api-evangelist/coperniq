        name:
          type:
            - string
            - 'null'
          minLength: 1
          maxLength: 500
          description: Section name (1–500 chars). Omit or pass null for an unnamed section.
        lineItems:
          type: array
          items:
            $ref: '#/components/schemas/InvoiceLineItemCreate'
          description: Line items within this section (at least one required)
      required:
        - lineItems
      description: A named section grouping one or more invoice line items.
      title: InvoiceSection
    InvoiceCreateStatus:
      type: string
      enum:
        - DRAFT
        - SENT
        - PARTIALLY_PAID
        - PAID
      description: |
        Optional; defaults to DRAFT when omitted. To finalize the invoice, set `SENT`,
        `PARTIALLY_PAID`, or `PAID` — `issueDate` is then required. Lifecycle statuses
        (DECLINED, OVERDUE) cannot be set at creation.
      title: InvoiceCreateStatus
    InvoiceCreate:
      type: object
      properties:
        recordId:
          type: integer
          minimum: 1
          description: Project or account ID
        calculationMethod:
          $ref: '#/components/schemas/InvoiceCreateCalculationMethod'
          description: Calculation method
        lineItems:
          type: array
          items:
            $ref: '#/components/schemas/InvoiceLineItemCreate'
          description: |
            Required when `calculationMethod` is `LINE_ITEMS` and `sections` is not provided.
            Flat array of line items (auto-grouped into one unnamed section).
        sections:
          type: array
          items:
            $ref: '#/components/schemas/InvoiceSection'
          description: |
            Required when `calculationMethod` is `LINE_ITEMS` and `lineItems` is not provided.
            Grouped line items with named sections. May be combined with `lineItems` (ungrouped items).
        percentage:
          type: number
          format: double
          minimum: 0
          description: Required when `calculationMethod` is `PERCENTAGE`.
        status:
          $ref: '#/components/schemas/InvoiceCreateStatus'
          description: |
            Optional; defaults to DRAFT when omitted. To finalize the invoice, set `SENT`,
            `PARTIALLY_PAID`, or `PAID` — `issueDate` is then required. Lifecycle statuses
            (DECLINED, OVERDUE) cannot be set at creation.
        issueDate:
          type: string
          format: date-time
          description: |
            Issue date (ISO 8601). Optional. Applied only when `status` is SENT/PARTIALLY_PAID/PAID
            (required for those); ignored for DRAFT invoices.
        dueDate:
          type: string
          format: date-time
          description: Due date (ISO 8601 datetime string)
        description:
          type:
            - string
            - 'null'
          description: Invoice description
      required:
        - recordId
        - calculationMethod
      description: >
        When `calculationMethod` is `LINE_ITEMS`, provide `lineItems`, `sections`, or both (ungrouped items + named
        sections). A `catalogItemId` may appear at most once across the flattened set.

        When `calculationMethod` is `PERCENTAGE`, `sections` and `lineItems` must be omitted.
      title: InvoiceCreate
