        - PRODUCT
        - SERVICE
      description: Catalog item type
      title: CatalogItemUpdateType
    CatalogItemUpdateWasteFactorMode:
      type: string
      enum:
        - STATIC
      description: Waste factor mode. Must be set together with wasteFactorValue — both, or neither.
      title: CatalogItemUpdateWasteFactorMode
    CatalogItemUpdate:
      type: object
      properties:
        type:
          $ref: '#/components/schemas/CatalogItemUpdateType'
          description: Catalog item type
        name:
          type: string
          description: Catalog item name
        category:
          $ref: '#/components/schemas/CatalogCategoryCode'
          description: Catalog item category code. Must be a valid ProductCategory or ServiceCategory value.
        code:
          type: string
          description: Catalog item code
        description:
          type:
            - string
            - 'null'
          description: Catalog item description
        cost:
          type: number
          format: double
          minimum: 0
          description: Catalog item cost
        price:
          type: number
          format: double
          minimum: 0
          description: Catalog item price
        tradeGroup:
          $ref: '#/components/schemas/TradeGroup'
          description: High-level trade group for this item.
        manufacturer:
          type:
            - string
            - 'null'
          description: Catalog item manufacturer. PRODUCT items only.
        sku:
          type:
            - string
            - 'null'
          description: >
            Catalog item SKU. PRODUCT items only — sending an SKU while the item is, or is becoming, a SERVICE returns
            400. Converting a PRODUCT that has an SKU into a SERVICE is allowed and does not require clearing it first:
            services have no SKU, so it is dropped as part of the conversion. Pass null to clear a PRODUCT SKU or during
            that conversion; an already-SERVICE item with a legacy SKU cannot change or clear it through this API and
            returns 400.
        isArchived:
          type: boolean
          description: >
            Set true to archive the item, or false to restore an archived one. Archiving via this field is equivalent to
            DELETE /catalog-items/{catalog_item_id}.
        preferredVendorId:
          type:
            - integer
            - 'null'
          description: ID of the preferred vendor. Pass null to clear the preferred vendor.
        unitId:
          type:
            - integer
            - 'null'
          description: ID of the unit this item is sold/measured in. Pass null to clear it.
        measurementIds:
          type: array
          items:
            type: integer
          description: >
            Replaces the full set of measurement/sub-calculation links driving this item's quantity. Omit this field to
            leave existing links unchanged; pass an empty array to clear all links. This is NOT a merge/append — any
            previously linked measurement not included here is unlinked. At most one linked measurement may be a
            sub-measurement (type SUB_CALCULATION), and it must be the only one linked.
        coverage:
          type:
            - number
            - 'null'
          format: double
          exclusiveMinimum: 0
          description: Measurement units covered per item unit. Must be greater than zero.
        wasteFactorMode:
          oneOf:
            - $ref: '#/components/schemas/CatalogItemUpdateWasteFactorMode'
            - type: 'null'
          description: Waste factor mode. Must be set together with wasteFactorValue — both, or neither.
        wasteFactorValue:
          type:
            - number
            - 'null'
          format: double
          minimum: 0
          maximum: 100
          description: Waste factor percentage (0-100). Must be set together with wasteFactorMode.
      title: CatalogItemUpdate
