  /sites/{site_id}/move:
    post:
      operationId: sites_moveSite
      summary: Move Site to Another Account
      description: >
        Move a site and all its associated records to a different account.


        **A new site is created with a new ID.** The original site (`siteId` in the path) is permanently

        deleted. The response contains the new site object — update any stored site IDs accordingly.


        The `fullAddress` and `title` are copied from the original site to the new one. The backend geocodes the address
        on the new site, so all address components (street, city, state, zipcode) are derived from geocoding.


        **Migrated records:** opportunities, projects, work orders, forms, services, systems, assets, and financial
        documents.


        > ⚠️ **This operation is irreversible.** The original site and its ID are permanently deleted.

        > Any references to the old `siteId` will no longer resolve.

        > Service plan instance links are removed — plans are account-scoped and cannot be transferred.
      tags:
        - sites
      parameters:
        - name: site_id
          in: path
          description: Site identifier
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: The newly created site on the target account. This site has a new `id` — the original site has been deleted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Site'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MoveSiteRequestBadRequestError'
        '401':
          description: Authentication failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MoveSiteRequestUnauthorizedError'
        '404':
          description: Resource not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MoveSiteRequestNotFoundError'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                accountId:
                  type: integer
                  description: The target account ID to move the site to.
              required:
                - accountId
      security:
        - ApiKeyAuth: []
