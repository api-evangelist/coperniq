    PaymentsPaymentIdPatchResponsesContentApplicationJsonSchemaCode:
      type: string
      enum:
      - NOT_FOUND
      title: PaymentsPaymentIdPatchResponsesContentApplicationJsonSchemaCode
    BillPayment:
      type: object
