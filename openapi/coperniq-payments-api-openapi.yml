              schema:
                $ref: '#/components/schemas/GetBillPaymentRequestNotFoundError'
      security:
      - ApiKeyAuth: []
  /payments/{payment_id}:
    patch:
      operationId: payments_updatePayment
      summary: Update Payment
      description: 'Update an existing payment record by its own id — no invoice or bill id is required in the path.


        Supports partial updates of `amount`, `paymentMethod`, `paymentDate`, `notes`, and `paymentReference` — the same fields the Coperniq UI exposes when editing a logged payment.


        If the payment is external (processed by Stripe), only `notes` may be updated; any other field returns a `400`.


        Updating `amount` may fail with a `400` if the new total would exceed the parent invoice/bill''s outstanding balance. The parent document''s `amountPaid`/`status` are recalculated automatically.'
      tags:
      - Payments
      parameters:
      - name: payment_id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Payment updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Payments_updatePayment_Response_200'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpdatePaymentRequestBadRequestError'
        '401':
          description: Authentication failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpdatePaymentRequestUnauthorizedError'
        '404':
          description: Resource not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpdatePaymentRequestNotFoundError'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PaymentUpdate'
      security:
      - ApiKeyAuth: []
    delete:
      operationId: payments_deletePayment
      summary: Delete Payment
      description: 'Delete a payment record by its own id — no invoice or bill id is required in the path.


        External payments (processed by Stripe) cannot be deleted — use a refund instead. Deleting a payment recalculates the parent invoice/bill''s `amountPaid`/`status` automatically.'
      tags:
      - Payments
      parameters:
      - name: payment_id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Successful response
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeletePaymentRequestBadRequestError'
        '401':
          description: Authentication failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeletePaymentRequestUnauthorizedError'
        '404':
          description: Resource not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeletePaymentRequestNotFoundError'
      security:
      - ApiKeyAuth: []
