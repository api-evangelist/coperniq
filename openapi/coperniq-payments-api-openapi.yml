        status:
          type: string
          description: Payment status
        paymentMethod:
          $ref: '#/components/schemas/PaymentMethod'
        paymentDate:
          type:
          - string
          - 'null'
          format: date-time
          description: When the payment was recorded (ISO 8601); null if absent from upstream
        paymentReference:
          type:
          - string
          - 'null'
        notes:
          type:
          - string
          - 'null'
        isExternal:
          type:
          - boolean
          - 'null'
          description: Whether the payment originated from an external processor (e.g. Stripe)
        createdAt:
          type:
          - string
          - 'null'
          format: date-time
        updatedAt:
          type:
          - string
          - 'null'
          format: date-time
        createdBy:
          oneOf:
          - $ref: '#/components/schemas/BillPaymentCreatedBy'
          - type: 'null'
      required:
      - id
      - amount
      - status
      - paymentMethod
      title: BillPayment
    UpdatePaymentRequestNotFoundError:
