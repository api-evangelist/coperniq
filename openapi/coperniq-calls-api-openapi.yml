openapi: 3.2.0
info:
  title: Reference Calls API
  version: 1.0.0
servers:
- url: https://api.coperniq.io/v1
  description: Production server
tags:
- name: Calls
paths:
  /calls:
    get:
      operationId: calls_listCalls
      summary: List Calls
      description: 'Retrieve a paginated list of calls across your whole company, including calls logged on

        projects, opportunities and accounts. Each call has `projectId`, `opportunityId` or

        `accountId` set to the record it''s logged on (all three are `null` for calls not yet

        linked to a record).


        Supports:

        - Pagination (`page_size`, `page`)

        - Date filtering (`updated_after`, `updated_before`)

        - Filtering by `outcome`, `reason` and `disposition`

        - Sorting by creation time (`order_by`, newest first by default)'
      tags:
      - Calls
      parameters:
      - name: page_size
        in: query
        description: Number of items per page (max 100)
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 20
      - name: page
        in: query
        description: Page number (1-based)
        required: false
        schema:
          type: integer
          minimum: 1
          default: 1
      - name: updated_after
        in: query
        description: Filter items updated after this timestamp (ISO 8601). Also matches records whose custom property values changed within the window.
        required: false
        schema:
          $ref: '#/components/schemas/CallsGetParametersUpdatedAfter'
      - name: updated_before
        in: query
        description: Filter items updated before this timestamp (ISO 8601). Also matches records whose custom property values changed within the window.
        required: false
        schema:
          $ref: '#/components/schemas/CallsGetParametersUpdatedBefore'
      - name: order_by
        in: query
        description: Sort by creation time. Defaults to newest first.
        required: false
        schema:
          $ref: '#/components/schemas/CallsGetParametersOrderBy'
      - name: outcome
        in: query
        description: Only return calls with this outcome
        required: false
        schema:
          $ref: '#/components/schemas/CallsGetParametersOutcome'
      - name: reason
        in: query
        description: Only return calls with exactly this reason (see `GET /calls/classification-options`)
        required: false
        schema:
          type: string
          maxLength: 255
      - name: disposition
        in: query
        description: Only return calls with exactly this disposition (see `GET /calls/classification-options`)
        required: false
        schema:
          type: string
          maxLength: 255
      responses:
        '200':
          description: List of calls
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CallListItem'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListCallsRequestBadRequestError'
        '401':
          description: Authentication failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListCallsRequestUnauthorizedError'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListCallsRequestInternalServerError'
        '502':
          description: Bad Gateway — downstream GraphQL service returned errors
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListCallsRequestBadGatewayError'
      security:
      - ApiKeyAuth: []
  /calls/classification-options:
    get:
      operationId: calls_listCallClassificationOptions
      summary: List Call Classification Options
      description: 'Lists your company''s call reasons and dispositions, ordered by type and then position.

        A call''s `reason` and `disposition` hold an option''s `name`. Options are company-defined,

        and renaming or deleting one does not change calls already logged with it.'
      tags:
      - Calls
      parameters:
      - name: type
        in: query
        description: Only return options of this type. Omit to return both.
        required: false
        schema:
          $ref: '#/components/schemas/CallsClassificationOptionsGetParametersType'
      responses:
        '200':
          description: List of call classification options
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CallClassificationOption'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListCallClassificationOptionsRequestBadRequestError'
        '401':
          description: Authentication failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListCallClassificationOptionsRequestUnauthorizedError'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListCallClassificationOptionsRequestInternalServerError'
        '502':
          description: Bad Gateway — downstream GraphQL service returned errors
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListCallClassificationOptionsRequestBadGatewayError'
      security:
      - ApiKeyAuth: []
  /projects/{project_id}/calls:
    get:
      operationId: calls_listProjectCalls
      summary: List Project Calls
      description: Retrieve all phone call records associated with a project
      tags:
      - Calls
      parameters:
      - name: project_id
        in: path
        description: Project identifier
        required: true
        schema:
          type: integer
      responses:
        '200':
          description: List of call records
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Call'
        '401':
          description: Authentication failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListProjectCallsRequestUnauthorizedError'
        '404':
          description: Resource not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListProjectCallsRequestNotFoundError'
        '502':
          description: Bad Gateway — downstream GraphQL service returned errors
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListProjectCallsRequestBadGatewayError'
      security:
      - ApiKeyAuth: []
    post:
      operationId: calls_createProjectCall
      summary: Create Project Call
      description: Create a new phone call record associated with a project
      tags:
      - Calls
      parameters:
      - name: project_id
        in: path
        required: true
        schema:
          type: string
      responses:
        '201':
          description: Call record created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Call'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateProjectCallRequestBadRequestError'
        '401':
          description: Authentication failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateProjectCallRequestUnauthorizedError'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CallCreate'
      security:
      - ApiKeyAuth: []
  /opportunities/{opportunity_id}/calls:
    get:
      operationId: calls_listOpportunityCalls
      summary: List Opportunity Calls
      description: 'Retrieve all phone call records associated with an opportunity


        **Note:** The `/requests` path is an alias for `/opportunities` and will continue to work until users are individually notified and migrated.'
      tags:
      - Calls
      parameters:
      - name: opportunity_id
        in: path
        description: Opportunity identifier
        required: true
        schema:
          type: integer
      responses:
        '200':
          description: List of call records
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Call'
        '401':
          description: Authentication failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListOpportunityCallsRequestUnauthorizedError'
        '404':
          description: Resource not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListOpportunityCallsRequestNotFoundError'
        '502':
          description: Bad Gateway — downstream GraphQL service returned errors
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListOpportunityCallsRequestBadGatewayError'
      security:
      - ApiKeyAuth: []
    post:
      operationId: calls_createOpportunityCall
      summary: Create Opportunity Call
      description: 'Create a new phone call record associated with an opportunity


        **Note:** The `/requests` path is an alias for `/opportunities` and will continue to work until users are individually notified and migrated.'
      tags:
      - Calls
      parameters:
      - name: opportunity_id
        in: path
        description: Opportunity identifier
        required: true
        schema:
          type: integer
      responses:
        '201':
          description: Call record created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Call'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateOpportunityCallRequestBadRequestError'
        '401':
          description: Authentication failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateOpportunityCallRequestUnauthorizedError'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CallCreate'
      security:
      - ApiKeyAuth: []
  /accounts/{account_id}/calls:
    get:
      operationId: calls_listAccountCalls
      summary: List Account Calls
      description: 'Retrieve all phone call records associated with an account


        **Note:** The `/clients` path is an alias for `/accounts` and will continue to work until users are individually notified and migrated.'
      tags:
      - Calls
      parameters:
      - name: account_id
        in: path
        description: Account identifier
        required: true
        schema:
          type: integer
      responses:
        '200':
          description: List of call records
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Call'
        '401':
          description: Authentication failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListAccountCallsRequestUnauthorizedError'
        '404':
          description: Resource not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListAccountCallsRequestNotFoundError'
        '502':
          description: Bad Gateway — downstream GraphQL service returned errors
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListAccountCallsRequestBadGatewayError'
      security:
      - ApiKeyAuth: []
    post:
      operationId: calls_createAccountCall
      summary: Create Account Call
      description: 'Create a new phone call record associated with an account


        **Note:** The `/clients` path is an alias for `/accounts` and will continue to work until users are individually notified and migrated.'
      tags:
      - Calls
      parameters:
      - name: account_id
        in: path
        description: Account identifier
        required: true
        schema:
          type: integer
      responses:
        '201':
          description: Call record created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Call'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateAccountCallRequestBadRequestError'
        '401':
          description: Authentication failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateAccountCallRequestUnauthorizedError'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CallCreate'
      security:
      - ApiKeyAuth: []
components:
  schemas:
    ListOpportunityCallsRequestBadGatewayError:
      type: object
      properties:
        message:
          type: string
          description: Summary of the downstream service failure
        code:
          $ref: '#/components/schemas/OpportunitiesOpportunityIdCallsGetResponsesContentApplicationJsonSchemaCode'
      required:
      - message
      - code
      title: ListOpportunityCallsRequestBadGatewayError
    ProjectsProjectIdCallsPostResponsesContentApplicationJsonSchemaCode:
      type: string
      enum:
      - UNAUTHORIZED
      title: ProjectsProjectIdCallsPostResponsesContentApplicationJsonSchemaCode
    CallsClassificationOptionsGetResponsesContentApplicationJsonSchemaCode:
      type: string
      enum:
      - GRAPHQL_ERROR
      title: CallsClassificationOptionsGetResponsesContentApplicationJsonSchemaCode
    CallCreate:
      type: object
      properties:
        fromNumber:
          type: string
          description: Phone number that initiated the call
        toNumber:
          type: string
          description: Phone number that received the call
        isInbound:
          type: boolean
          default: false
          description: Whether the call was inbound (true) or outbound (false)
        outcome:
          $ref: '#/components/schemas/CallCreateOutcome'
          description: Call outcome
        startTime:
          type: string
          format: date-time
          description: When the call started
        endTime:
          type: string
          format: date-time
          description: When the call ended
        reason:
          type: string
          minLength: 1
          maxLength: 255
          description: 'Why the call happened. Company-defined: the value is the name of one of the company''s

            call reasons (see `GET /calls/classification-options?type=REASON`), so it can be any

            string up to 255 characters. Default reasons are Product, Process, Service, Accounting,

            Revenue opportunity, Feedback and Other. Calls logged before custom reasons existed

            hold the legacy uppercase value (e.g. `SERVICE`).

            Any string is accepted; use a name from the company''s list so the call groups with others in Coperniq.

            '
        disposition:
          type: string
          minLength: 1
          maxLength: 255
          description: 'How the call ended up. Company-defined: the value is the name of one of the company''s

            call dispositions (see `GET /calls/classification-options?type=DISPOSITION`), so it can

            be any string up to 255 characters. Default dispositions are Info provided, Visit

            scheduled, Issue resolved, Follow up, Escalation, No action, Unresponsive and Other.

            Calls logged before custom dispositions existed hold the legacy uppercase value

            (e.g. `INFO_PROVIDED`).

            Any string is accepted; use a name from the company''s list so the call groups with others in Coperniq.

            '
        note:
          type: string
          description: Human-editable note about the call. May contain HTML.
        recordingUrl:
          type: string
          description: URL to the call recording
        transcriptUrl:
          type: string
          description: URL to an externally hosted call transcript
        missedCount:
          type: integer
          description: Number of times the call was missed
      required:
      - fromNumber
      - toNumber
      - isInbound
      - startTime
      - endTime
      - reason
      - disposition
      title: CallCreate
    ListCallsRequestBadGatewayError:
      type: object
      properties:
        message:
          type: string
          description: Summary of the downstream service failure
        code:
          $ref: '#/components/schemas/CallsGetResponsesContentApplicationJsonSchemaCode'
      required:
      - message
      - code
      title: ListCallsRequestBadGatewayError
    CallsGetParametersOutcome:
      type: string
      enum:
      - ANSWERED
      - MISSED
      - VOICEMAIL
      title: CallsGetParametersOutcome
    ListAccountCallsRequestBadGatewayError:
      type: object
      properties:
        message:
          type: string
          description: Summary of the downstream service failure
        code:
          $ref: '#/components/schemas/AccountsAccountIdCallsGetResponsesContentApplicationJsonSchemaCode'
      required:
      - message
      - code
      title: ListAccountCallsRequestBadGatewayError
    CreateProjectCallRequestUnauthorizedError:
      type: object
      properties:
        message:
          type: string
        code:
          $ref: '#/components/schemas/ProjectsProjectIdCallsPostResponsesContentApplicationJsonSchemaCode'
      title: CreateProjectCallRequestUnauthorizedError
    CreateAccountCallRequestBadRequestError:
      type: object
      properties:
        message:
          type: string
        code:
          $ref: '#/components/schemas/AccountsAccountIdCallsPostResponsesContentApplicationJsonSchemaCode'
        field:
          type: string
          description: Field that caused the validation error (if applicable)
      title: CreateAccountCallRequestBadRequestError
    CreateAccountCallRequestUnauthorizedError:
      type: object
      properties:
        message:
          type: string
        code:
          $ref: '#/components/schemas/AccountsAccountIdCallsPostResponsesContentApplicationJsonSchemaCode'
      title: CreateAccountCallRequestUnauthorizedError
    ListCallClassificationOptionsRequestInternalServerError:
      type: object
      properties:
        message:
          type: string
        code:
          $ref: '#/components/schemas/CallsClassificationOptionsGetResponsesContentApplicationJsonSchemaCode'
      title: ListCallClassificationOptionsRequestInternalServerError
    CallClassificationOption:
      type: object
      properties:
        id:
          type: integer
          description: Option identifier
        type:
          $ref: '#/components/schemas/CallClassificationOptionType'
          description: Whether this option is a call reason or a call disposition
        name:
          type: string
          description: The value stored on a call's `reason` or `disposition`
        description:
          type:
          - string
          - 'null'
          description: Guidance on when to use this option. Coperniq AI also uses it when classifying calls.
        position:
          type: integer
          description: Sort order within its type
      required:
      - id
      - type
      - name
      - position
      title: CallClassificationOption
    CallOutcome:
      type: string
      enum:
      - ANSWERED
      - MISSED
      - VOICEMAIL
      description: Call outcome
      title: CallOutcome
    OpportunitiesOpportunityIdCallsPostResponsesContentApplicationJsonSchemaCode:
      type: string
      enum:
      - UNAUTHORIZED
      title: OpportunitiesOpportunityIdCallsPostResponsesContentApplicationJsonSchemaCode
    AccountsAccountIdCallsGetResponsesContentApplicationJsonSchemaCode:
      type: string
      enum:
      - GRAPHQL_ERROR
      title: AccountsAccountIdCallsGetResponsesContentApplicationJsonSchemaCode
    CallListItem:
      type: object
      properties:
        id:
          type: integer
          description: Call identifier
        fromNumber:
          type: string
          description: Phone number that initiated the call
        toNumber:
          type: string
          description: Phone number that received the call
        isInbound:
          type: boolean
          description: Whether the call was inbound (true) or outbound (false)
        outcome:
          oneOf:
          - $ref: '#/components/schemas/CallListItemOutcome'
          - type: 'null'
          description: Call outcome
        startTime:
          type:
          - string
          - 'null'
          format: date-time
          description: When the call started
        endTime:
          type:
          - string
          - 'null'
          format: date-time
          description: When the call ended
        reason:
          type:
          - string
          - 'null'
          maxLength: 255
          description: 'Why the call happened. Company-defined: the value is the name of one of the company''s

            call reasons (see `GET /calls/classification-options?type=REASON`), so it can be any

            string up to 255 characters. Default reasons are Product, Process, Service, Accounting,

            Revenue opportunity, Feedback and Other. Calls logged before custom reasons existed

            hold the legacy uppercase value (e.g. `SERVICE`).

            '
        disposition:
          type:
          - string
          - 'null'
          maxLength: 255
          description: 'How the call ended up. Company-defined: the value is the name of one of the company''s

            call dispositions (see `GET /calls/classification-options?type=DISPOSITION`), so it can

            be any string up to 255 characters. Default dispositions are Info provided, Visit

            scheduled, Issue resolved, Follow up, Escalation, No action, Unresponsive and Other.

            Calls logged before custom dispositions existed hold the legacy uppercase value

            (e.g. `INFO_PROVIDED`).

            '
        note:
          type:
          - string
          - 'null'
          description: Human-editable note about the call. May contain HTML.
        summary:
          type:
          - string
          - 'null'
          description: AI-generated summary of the call. `null` when the call has no AI transcript.
        transcriptText:
          type:
          - string
          - 'null'
          description: AI transcript of the call as plain text, one sentence per line in spoken order. `null` when the call has no AI transcript.
        recordingUrl:
          type:
          - string
          - 'null'
          description: URL to the call recording
        transcriptUrl:
          type:
          - string
          - 'null'
          description: URL to an externally hosted call transcript, if one was provided when the call was logged. For Coperniq phone calls use `transcriptText`.
        missedCount:
          type:
          - integer
          - 'null'
          description: Number of times the call was missed
        classificationNote:
          type:
          - string
          - 'null'
          description: For calls classified by Coperniq AI, the AI's explanation of why it chose the reason and disposition.
        resolution:
          oneOf:
          - $ref: '#/components/schemas/CallListItemResolution'
          - type: 'null'
          description: For calls handled by a Coperniq AI agent, whether the caller's issue was resolved.
        createdAt:
          type: string
          format: date-time
          description: Creation timestamp
        updatedAt:
          type: string
          format: date-time
          description: Last update timestamp
        projectId:
          type:
          - integer
          - 'null'
          description: The project this call is logged on, if it's on a project
        opportunityId:
          type:
          - integer
          - 'null'
          description: The opportunity this call is logged on, if it's on an opportunity
        accountId:
          type:
          - integer
          - 'null'
          description: The account this call is logged on, if it's on an account
      required:
      - id
      - fromNumber
      - toNumber
      - isInbound
      - createdAt
      - updatedAt
      title: CallListItem
    ListCallsRequestBadRequestError:
      type: object
      properties:
        message:
          type: string
        code:
          $ref: '#/components/schemas/CallsGetResponsesContentApplicationJsonSchemaCode'
        field:
          type: string
          description: Field that caused the validation error (if applicable)
      title: ListCallsRequestBadRequestError
    OpportunitiesOpportunityIdCallsGetResponsesContentApplicationJsonSchemaCode:
      type: string
      enum:
      - GRAPHQL_ERROR
      title: OpportunitiesOpportunityIdCallsGetResponsesContentApplicationJsonSchemaCode
    CreateOpportunityCallRequestBadRequestError:
      type: object
      properties:
        message:
          type: string
        code:
          $ref: '#/components/schemas/OpportunitiesOpportunityIdCallsPostResponsesContentApplicationJsonSchemaCode'
        field:
          type: string
          description: Field that caused the validation error (if applicable)
      title: CreateOpportunityCallRequestBadRequestError
    CallListItemOutcome:
      type: string
      enum:
      - ANSWERED
      - MISSED
      - VOICEMAIL
      description: Call outcome
      title: CallListItemOutcome
    CreateProjectCallRequestBadRequestError:
      type: object
      properties:
        message:
          type: string
        code:
          $ref: '#/components/schemas/ProjectsProjectIdCallsPostResponsesContentApplicationJsonSchemaCode'
        field:
          type: string
          description: Field that caused the validation error (if applicable)
      title: CreateProjectCallRequestBadRequestError
    ListOpportunityCallsRequestUnauthorizedError:
      type: object
      properties:
        message:
          type: string
        code:
          $ref: '#/components/schemas/OpportunitiesOpportunityIdCallsGetResponsesContentApplicationJsonSchemaCode'
      title: ListOpportunityCallsRequestUnauthorizedError
    ListCallsRequestInternalServerError:
      type: object
      properties:
        message:
          type: string
        code:
          $ref: '#/components/schemas/CallsGetResponsesContentApplicationJsonSchemaCode'
      title: ListCallsRequestInternalServerError
    ListProjectCallsRequestUnauthorizedError:
      type: object
      properties:
        message:
          type: string
        code:
          $ref: '#/components/schemas/ProjectsProjectIdCallsGetResponsesContentApplicationJsonSchemaCode'
      title: ListProjectCallsRequestUnauthorizedError
    ListAccountCallsRequestUnauthorizedError:
      type: object
      properties:
        message:
          type: string
        code:
          $ref: '#/components/schemas/AccountsAccountIdCallsGetResponsesContentApplicationJsonSchemaCode'
      title: ListAccountCallsRequestUnauthorizedError
    ListCallsRequestUnauthorizedError:
      type: object
      properties:
        message:
          type: string
        code:
          $ref: '#/components/schemas/CallsGetResponsesContentApplicationJsonSchemaCode'
      title: ListCallsRequestUnauthorizedError
    ListCallClassificationOptionsRequestBadRequestError:
      type: object
      properties:
        message:
          type: string
        code:
          $ref: '#/components/schemas/CallsClassificationOptionsGetResponsesContentApplicationJsonSchemaCode'
        field:
          type: string
          description: Field that caused the validation error (if applicable)
      title: ListCallClassificationOptionsRequestBadRequestError
    CallsGetParametersUpdatedBefore:
      oneOf:
      - type: string
        format: date
      - type: string
        format: date-time
      title: CallsGetParametersUpdatedBefore
    ListCallClassificationOptionsRequestBadGatewayError:
      type: object
      properties:
        message:
          type: string
          description: Summary of the downstream service failure
        code:
          $ref: '#/components/schemas/CallsClassificationOptionsGetResponsesContentApplicationJsonSchemaCode'
      required:
      - message
      - code
      title: ListCallClassificationOptionsRequestBadGatewayError
    CallsClassificationOptionsGetParametersType:
      type: string
      enum:
      - REASON
      - DISPOSITION
      title: CallsClassificationOptionsGetParametersType
    ListAccountCallsRequestNotFoundError:
      type: object
      properties:
        message:
          type: string
        code:
          $ref: '#/components/schemas/AccountsAccountIdCallsGetResponsesContentApplicationJsonSchemaCode'
      title: ListAccountCallsRequestNotFoundError
    ListCallClassificationOptionsRequestUnauthorizedError:
      type: object
      properties:
        message:
          type: string
        code:
          $ref: '#/components/schemas/CallsClassificationOptionsGetResponsesContentApplicationJsonSchemaCode'
      title: ListCallClassificationOptionsRequestUnauthorizedError
    Call:
      type: object
      properties:
        id:
          type: integer
          description: Call identifier
        fromNumber:
          type: string
          description: Phone number that initiated the call
        toNumber:
          type: string
          description: Phone number that received the call
        isInbound:
          type: boolean
          description: Whether the call was inbound (true) or outbound (false)
        outcome:
          oneOf:
