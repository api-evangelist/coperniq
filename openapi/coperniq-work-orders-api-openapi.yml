openapi: 3.2.0
info:
  title: Reference Work Orders API
  version: 1.0.0
servers:
- url: https://api.coperniq.io/v1
  description: Production server
tags:
- name: Work Orders
paths:
  /work-orders:
    get:
      operationId: workOrders_listWorkOrders
      summary: List Work Orders
      description: 'Retrieve a paginated list of work orders across all projects.


        Supports:

        - Pagination (`page_size`, `page`)

        - Date filtering (`updated_after`, `updated_before`)

        - Sorting (`order_by`)'
      tags:
      - Work Orders
      parameters:
      - name: page_size
        in: query
        description: Number of items per page (max 100)
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 20
      - name: page
        in: query
        description: Page number (1-based)
        required: false
        schema:
          type: integer
          minimum: 1
          default: 1
      - name: updated_after
        in: query
        description: Filter items updated after this timestamp (ISO 8601). Also matches records whose custom property values changed within the window.
        required: false
        schema:
          $ref: '#/components/schemas/WorkOrdersGetParametersUpdatedAfter'
      - name: updated_before
        in: query
        description: Filter items updated before this timestamp (ISO 8601). Also matches records whose custom property values changed within the window.
        required: false
        schema:
          $ref: '#/components/schemas/WorkOrdersGetParametersUpdatedBefore'
      - name: order_by
        in: query
        description: Sort order for results
        required: false
        schema:
          $ref: '#/components/schemas/WorkOrdersGetParametersOrderBy'
      responses:
        '200':
          description: List of work orders
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/WorkOrder'
        '401':
          description: Authentication failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListWorkOrdersRequestUnauthorizedError'
      security:
      - ApiKeyAuth: []
  /projects/{project_id}/work-orders:
    get:
      operationId: workOrders_listProjectWorkOrders
      summary: List Project Work Orders
      description: 'Retrieve work orders for a specific project.


        Supports:

        - Pagination (`page_size`, `page`)

        - Date filtering (`updated_after`, `updated_before`)

        - Sorting (`order_by`)'
      tags:
      - Work Orders
      parameters:
      - name: project_id
        in: path
        description: Project identifier
        required: true
        schema:
          type: integer
      - name: page_size
        in: query
        description: Number of items per page (max 100)
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 20
      - name: page
        in: query
        description: Page number (1-based)
        required: false
        schema:
          type: integer
          minimum: 1
          default: 1
      - name: updated_after
        in: query
        description: Filter items updated after this timestamp (ISO 8601). Also matches records whose custom property values changed within the window.
        required: false
        schema:
          $ref: '#/components/schemas/ProjectsProjectIdWorkOrdersGetParametersUpdatedAfter'
      - name: updated_before
        in: query
        description: Filter items updated before this timestamp (ISO 8601). Also matches records whose custom property values changed within the window.
        required: false
        schema:
          $ref: '#/components/schemas/ProjectsProjectIdWorkOrdersGetParametersUpdatedBefore'
      - name: order_by
        in: query
        description: Sort order for results
        required: false
        schema:
          $ref: '#/components/schemas/ProjectsProjectIdWorkOrdersGetParametersOrderBy'
      responses:
        '200':
          description: List of work orders
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/WorkOrder'
        '401':
          description: Authentication failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListProjectWorkOrdersRequestUnauthorizedError'
        '404':
          description: Resource not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListProjectWorkOrdersRequestNotFoundError'
      security:
      - ApiKeyAuth: []
    post:
      operationId: workOrders_createProjectWorkOrder
      summary: Create Project Work Order
      description: 'Create a new work order in a project.


        Notes:

        - `templateId` is required.

        - `phaseInstanceId` is optional; if provided the referenced phase must be started (active) for creation to succeed.'
      tags:
      - Work Orders
      parameters:
      - name: project_id
        in: path
        description: Project identifier
        required: true
        schema:
          type: integer
      responses:
        '201':
          description: Work order created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkOrderCreateResponse'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateProjectWorkOrderRequestBadRequestError'
        '401':
          description: Authentication failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateProjectWorkOrderRequestUnauthorizedError'
        '404':
          description: Resource not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateProjectWorkOrderRequestNotFoundError'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                templateId:
                  type: integer
                  description: Template to use for the work order
                phaseInstanceId:
                  type: integer
                  description: Optional. Phase instance id where the work order will be created (phase must be started). You can gather phase instance ids from the get project endpoint.
              required:
              - templateId
      security:
      - ApiKeyAuth: []
  /opportunities/{opportunity_id}/work-orders:
    get:
      operationId: workOrders_listOpportunityWorkOrders
      summary: List Opportunity Work Orders
      description: 'Retrieve work orders for a specific opportunity


        **Note:** The `/requests` path is an alias for `/opportunities` and will continue to work until users are individually notified and migrated.'
      tags:
      - Work Orders
      parameters:
      - name: opportunity_id
        in: path
        description: Opportunity identifier
        required: true
        schema:
          type: integer
      responses:
        '200':
          description: List of work orders
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/WorkOrder'
      security:
      - ApiKeyAuth: []
    post:
      operationId: workOrders_createOpportunityWorkOrder
      summary: Create Opportunity Work Order
      description: 'Create a new work order for an opportunity.


        Notes:

        - `templateId` is required.

        - `phaseInstanceId` is optional. The phase does not need to be started to create an opportunity work order.


        **Note:** The `/requests` path is an alias for `/opportunities` and will continue to work until users are individually notified and migrated.'
      tags:
      - Work Orders
      parameters:
      - name: opportunity_id
        in: path
        description: Opportunity identifier
        required: true
        schema:
          type: integer
      responses:
        '201':
          description: Work order created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkOrderCreateResponse'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateOpportunityWorkOrderRequestBadRequestError'
        '401':
          description: Authentication failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateOpportunityWorkOrderRequestUnauthorizedError'
        '404':
          description: Resource not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateOpportunityWorkOrderRequestNotFoundError'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                templateId:
                  type: integer
                  description: The ID of the work order template to use
                phaseInstanceId:
                  type: integer
                  description: Optional. The ID of the phase instance to use. If provided, the phase does not need to be started to create an opportunity work order. You can gather phase instance ids from the get opportunity endpoint.
              required:
              - templateId
      security:
      - ApiKeyAuth: []
  /accounts/{account_id}/work-orders:
    get:
      operationId: workOrders_listAccountWorkOrders
      summary: List Account Work Orders
      description: 'Retrieve work orders for a specific account


        **Note:** The `/clients` path is an alias for `/accounts` and will continue to work until users are individually notified and migrated.'
      tags:
      - Work Orders
      parameters:
      - name: account_id
        in: path
        description: Account identifier
        required: true
        schema:
          type: integer
      responses:
        '200':
          description: List of work orders
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/WorkOrder'
      security:
      - ApiKeyAuth: []
    post:
      operationId: workOrders_createAccountWorkOrder
      summary: Create Account Work Order
      description: 'Create a new work order for an account (no phases)


        **Note:** The `/clients` path is an alias for `/accounts` and will continue to work until users are individually notified and migrated.'
      tags:
      - Work Orders
      parameters:
      - name: account_id
        in: path
        description: Account identifier
        required: true
        schema:
          type: integer
      responses:
        '201':
          description: Work order created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkOrderCreateResponse'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateAccountWorkOrderRequestBadRequestError'
        '401':
          description: Authentication failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateAccountWorkOrderRequestUnauthorizedError'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                templateId:
                  type: integer
              required:
              - templateId
      security:
      - ApiKeyAuth: []
  /work-orders/{work_order_id}:
    get:
      operationId: workOrders_getWorkOrder
      summary: Get Work Order
      description: 'Retrieve a specific work order by ID.


        The `lineItems` property is returned **only** for service work orders on an **account** (parent project type `ACCOUNT`), and **only** when at least one line item exists. Otherwise the field is omitted from the JSON object.'
      tags:
      - Work Orders
      parameters:
      - name: work_order_id
        in: path
        description: Work order identifier
        required: true
        schema:
          type: integer
      responses:
        '200':
          description: Work order details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkOrder'
        '401':
          description: Authentication failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetWorkOrderRequestUnauthorizedError'
        '404':
          description: Resource not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetWorkOrderRequestNotFoundError'
      security:
      - ApiKeyAuth: []
  /work-orders/templates:
    get:
      operationId: workOrders_listWorkOrderTemplates
      summary: List Work Order Templates
      description: Retrieve available work order templates. Returns all templates (not paginated).
      tags:
      - Work Orders
      responses:
        '200':
          description: List of work order templates
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/WorkOrderTemplate'
        '401':
          description: Authentication failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListWorkOrderTemplatesRequestUnauthorizedError'
      security:
      - ApiKeyAuth: []
  /projects/{project_id}/work-orders/{work_order_id}:
    patch:
      operationId: workOrders_updateProjectWorkOrder
      summary: Update Project Work Order
      description: 'Update a project''s work order. Supports partial updates.


        Updatable fields:

        - title, description, priority

        - startDate, endDate, startDateAllDay, endDateAllDay

        - status (label string)

        - assigneeId

        - visits: Only applicable on field work orders. When provided, the `visits` array REPLACES the full set of visits for the work order. Include all existing visits you wish to keep or update (with their `id`), and include new visits without an `id`. Any existing visit not included in the request will be removed. Visit booleans default to false when omitted.

        - checklist: Update the checklist for the work order.

        When this field is provided, the `checklist` array REPLACES the full set of checklist items on the work order.

        - Include every existing item you want to keep or modify (identified by `id`).

        - Any existing item NOT included in this array will be removed.

        - Each item MUST include an `id`. Items without an `id` are ignored (checklist item creation is not supported).

        - isActive: Set to `false` to archive the work order, or `true` to unarchive it. Applied independently of any other fields present in the same request.'
      tags:
      - Work Orders
      parameters:
      - name: project_id
        in: path
        description: Project identifier
        required: true
        schema:
          type: integer
      - name: work_order_id
        in: path
        description: Work order identifier
        required: true
        schema:
          type: integer
      responses:
        '200':
          description: Work order updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkOrder'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpdateProjectWorkOrderRequestBadRequestError'
        '401':
          description: Authentication failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpdateProjectWorkOrderRequestUnauthorizedError'
        '404':
          description: Resource not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpdateProjectWorkOrderRequestNotFoundError'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WorkOrderUpdate'
      security:
      - ApiKeyAuth: []
    delete:
      operationId: workOrders_deleteProjectWorkOrder
      summary: Delete Project Work Order
      description: Delete a specific work order from a project
      tags:
      - Work Orders
      parameters:
      - name: project_id
        in: path
        description: Project identifier
        required: true
        schema:
          type: integer
      - name: work_order_id
        in: path
        description: Work order identifier
        required: true
        schema:
          type: integer
      responses:
        '200':
          description: Successful response
        '400':
          description: Invalid request (missing or invalid parameters)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeleteProjectWorkOrderRequestBadRequestError'
        '401':
          description: Authentication failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeleteProjectWorkOrderRequestUnauthorizedError'
        '404':
          description: Resource not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeleteProjectWorkOrderRequestNotFoundError'
      security:
      - ApiKeyAuth: []
  /opportunities/{opportunity_id}/work-orders/{work_order_id}:
    patch:
      operationId: workOrders_updateOpportunityWorkOrder
      summary: Update Opportunity Work Order
      description: 'Update an opportunity''s work order. Supports partial updates.


        **Note:** The `/requests` path is an alias for `/opportunities` and will continue to work until users are individually notified and migrated.


        Updatable fields:

        - title, description, priority

        - startDate, endDate, startDateAllDay, endDateAllDay

        - status (label string)

        - assigneeId

        - visits: Only applicable on field work orders. When provided, the `visits` array REPLACES the full set of visits for the work order. Include all existing visits you wish to keep or update (with their `id`), and include new visits without an `id`. Any existing visit not included in the request will be removed. Visit booleans default to false when omitted.

        - checklist: Update the checklist for the work order.

        When this field is provided, the `checklist` array REPLACES the full set of checklist items on the work order.

        - Include every existing item you want to keep or modify (identified by `id`).

        - Any existing item NOT included in this array will be removed.

        - Each item MUST include an `id`. Items without an `id` are ignored (checklist item creation is not supported).

        - isActive: Set to `false` to archive the work order, or `true` to unarchive it. Applied independently of any other fields present in the same request.'
      tags:
      - Work Orders
      parameters:
      - name: opportunity_id
        in: path
        description: Opportunity identifier
        required: true
        schema:
          type: integer
      - name: work_order_id
        in: path
        description: Work order identifier
        required: true
        schema:
          type: integer
      responses:
        '200':
          description: Work order updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkOrder'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpdateOpportunityWorkOrderRequestBadRequestError'
        '401':
          description: Authentication failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpdateOpportunityWorkOrderRequestUnauthorizedError'
        '404':
          description: Resource not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpdateOpportunityWorkOrderRequestNotFoundError'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WorkOrderUpdate'
      security:
      - ApiKeyAuth: []
    delete:
      operationId: workOrders_deleteOpportunityWorkOrder
      summary: Delete Opportunity Work Order
      description: 'Delete an opportunity''s work order by ID


        **Note:** The `/requests` path is an alias for `/opportunities` and will continue to work until users are individually notified and migrated.'
      tags:
      - Work Orders
      parameters:
      - name: opportunity_id
        in: path
        description: Opportunity identifier
        required: true
        schema:
          type: integer
      - name: work_order_id
        in: path
        description: Work order identifier
        required: true
        schema:
          type: integer
      responses:
        '200':
          description: Successful response
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeleteOpportunityWorkOrderRequestBadRequestError'
        '401':
          description: Authentication failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeleteOpportunityWorkOrderRequestUnauthorizedError'
        '404':
          description: Resource not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeleteOpportunityWorkOrderRequestNotFoundError'
      security:
      - ApiKeyAuth: []
  /accounts/{account_id}/work-orders/{work_order_id}:
    patch:
      operationId: workOrders_updateAccountWorkOrder
      summary: Update Account Work Order
      description: 'Update an account''s work order. Supports partial updates.


        **Note:** The `/clients` path is an alias for `/accounts` and will continue to work until users are individually notified and migrated.


        Updatable fields:

        - title, description, priority

        - startDate, endDate, startDateAllDay, endDateAllDay

        - status (label string)

        - assigneeId

        - visits: Only applicable on field work orders. When provided, the `visits` array REPLACES the full set of visits for the work order. Include all existing visits you wish to keep or update (with their `id`), and include new visits without an `id`. Any existing visit not included in the request will be removed. Visit booleans default to false when omitted.

        - checklist: Update the checklist for the work order.

        When this field is provided, the `checklist` array REPLACES the full set of checklist items on the work order.

        - Include every existing item you want to keep or modify (identified by `id`).

        - Any existing item NOT included in this array will be removed.

        - Each item MUST include an `id`. Items without an `id` are ignored (checklist item creation is not supported).

        - isActive: Set to `false` to archive the work order, or `true` to unarchive it. Applied independently of any other fields present in the same request.


        **Line items** are not updated here. For account (service) work orders, replace quote line items with **`PUT /work-orders/{work_order_id}/line-items`** (see **Line Items** in this reference).'
      tags:
      - Work Orders
      parameters:
      - name: account_id
        in: path
        description: Account identifier
        required: true
        schema:
          type: integer
      - name: work_order_id
        in: path
        description: Work order identifier
        required: true
        schema:
          type: integer
      responses:
        '200':
          description: Work order updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkOrder'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpdateAccountWorkOrderRequestBadRequestError'
        '401':
          description: Authentication failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpdateAccountWorkOrderRequestUnauthorizedError'
        '404':
          description: Resource not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpdateAccountWorkOrderRequestNotFoundError'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WorkOrderUpdate'
      security:
      - ApiKeyAuth: []
    delete:
      operationId: workOrders_deleteAccountWorkOrder
      summary: Delete Account Work Order
      description: 'Delete a specific work order for an account


        **Note:** The `/clients` path is an alias for `/accounts` and will continue to work until users are individually notified and migrated.'
      tags:
      - Work Orders
      parameters:
      - name: account_id
        in: path
        description: Account identifier
        required: true
        schema:
          type: integer
      - name: work_order_id
        in: path
        description: Work order identifier
        required: true
        schema:
          type: integer
      responses:
        '200':
          description: Successful response
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeleteAccountWorkOrderRequestBadRequestError'
        '401':
          description: Authentication failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeleteAccountWorkOrderRequestUnauthorizedError'
        '404':
          description: Resource not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeleteAccountWorkOrderRequestNotFoundError'
      security:
      - ApiKeyAuth: []
components:
  schemas:
    Measurement:
      type: object
      properties:
        id:
          type: integer
          description: Measurement identifier
        name:
          type: string
          description: Measurement name
        type:
          $ref: '#/components/schemas/MeasurementType'
          description: A plain MEASUREMENT is a raw input value; a SUB_CALCULATION ("sub-measurement") derives its value from a formula over other measurements.
        unit:
          oneOf:
          - $ref: '#/components/schemas/CatalogUnit'
          - type: 'null'
          description: The unit this measurement is expressed in, if any.
        minimumValue:
          type:
          - number
          - 'null'
          format: double
          description: Minimum allowed value. Only meaningful for type MEASUREMENT.
        formula:
          $ref: '#/components/schemas/MeasurementFormula'
        isArchived:
          type: boolean
          description: Whether this measurement has been archived.
      required:
      - id
      - name
      - type
      description: 'A named measurement or sub-calculation that a catalog item can link to (via `measurementIds`) to drive its quantity. A "sub-measurement" is simply a Measurement with `type: SUB_CALCULATION` — not a separate structure.

        '
      title: Measurement
    ProjectsProjectIdWorkOrdersGetResponsesContentApplicationJsonSchemaCode:
      type: string
      enum:
      - NOT_FOUND
      title: ProjectsProjectIdWorkOrdersGetResponsesContentApplicationJsonSchemaCode
    WorkOrderFormItemType:
      type: string
      enum:
      - FORM
      title: WorkOrderFormItemType
    AccountsAccountIdWorkOrdersWorkOrderIdDeleteResponsesContentApplicationJsonSchemaCode:
      type: string
      enum:
      - NOT_FOUND
      title: AccountsAccountIdWorkOrdersWorkOrderIdDeleteResponsesContentApplicationJsonSchemaCode
    WorkOrdersGetParametersUpdatedAfter:
      oneOf:
      - type: string
        format: date
      - type: string
        format: date-time
      title: WorkOrdersGetParametersUpdatedAfter
    DeleteProjectWorkOrderRequestUnauthorizedError:
      type: object
      properties:
        message:
          type: string
        code:
          $ref: '#/components/schemas/ProjectsProjectIdWorkOrdersWorkOrderIdDeleteResponsesContentApplicationJsonSchemaCode'
      title: DeleteProjectWorkOrderRequestUnauthorizedError
    WorkOrderLineItem:
      type: object
      properties:
        id:
          type: integer
        quantity:
          type: integer
        description:
          type:
          - string
          - 'null'
        unitCost:
          type: number
          format: double
        totalCost:
          type:
          - number
          - 'null'
          format: double
        unitPrice:
          type: number
          format: double
        totalPrice:
          type:
          - number
          - 'null'
          format: double
        sectionName:
          type:
          - string
          - 'null'
        catalogItem:
          oneOf:
          - $ref: '#/components/schemas/WorkOrderLineItemCatalogItem'
          - type: 'null'
      title: WorkOrderLineItem
    ProjectsProjectIdWorkOrdersGetParametersUpdatedAfter:
      oneOf:
      - type: string
        format: date
      - type: string
        format: date-time
      title: ProjectsProjectIdWorkOrdersGetParametersUpdatedAfter
    CatalogItemWasteFactorMode:
      type: string
      enum:
      - STATIC
      description: Waste factor mode applied when computing this item's quantity. Currently only STATIC is supported. Paired with wasteFactorValue — both are set, or neither.
      title: CatalogItemWasteFactorMode
    DeleteProjectWorkOrderRequestNotFoundError:
      type: object
      properties:
        message:
          type: string
        code:
          $ref: '#/components/schemas/ProjectsProjectIdWorkOrdersWorkOrderIdDeleteResponsesContentApplicationJsonSchemaCode'
      title: DeleteProjectWorkOrderRequestNotFoundError
    WorkOrderWorkItem:
      oneOf:
      - type: object
        properties:
          type:
