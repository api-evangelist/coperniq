          description: The unit this item is sold/measured in, if any. Set on write via `unitId`.
        measurements:
          type: array
          items:
            $ref: '#/components/schemas/Measurement'
          description: Measurements (and sub-measurements) linked to this item to drive its quantity calculation. A sub-measurement is a linked Measurement with `type SUB_CALCULATION`; at most one may be linked, and it must be the only link when present.
        coverage:
          type:
          - number
          - 'null'
          format: double
          description: Measurement units covered per item unit (e.g. a bundle covering ~33.33 SF). Used to size quantity from summed linked measurements; not used when the item is linked to a sub-calculation, which derives quantity from its own formula.
        wasteFactorMode:
          oneOf:
          - $ref: '#/components/schemas/CatalogItemWasteFactorMode'
          - type: 'null'
          description: Waste factor mode applied when computing this item's quantity. Currently only STATIC is supported. Paired with wasteFactorValue — both are set, or neither.
        wasteFactorValue:
          type:
          - number
          - 'null'
          format: double
          description: Waste factor percentage (0-100) applied when computing this item's quantity. Paired with wasteFactorMode.
