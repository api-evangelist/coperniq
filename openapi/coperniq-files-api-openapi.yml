                phaseInstanceId:
                  type: integer
                  description: Optional. The ID of the phase instance to use. If provided, the phase does not need to be started to upload a file. You can gather phase instance ids from the get opportunity endpoint.
              required:
              - url
      security:
      - ApiKeyAuth: []
  /accounts/{account_id}/files:
    get:
      operationId: files_getAccountFiles
      summary: Get Account Files
      description: 'Retrieve all files associated with an account


        **Note:** The `/clients` path is an alias for `/accounts` and will continue to work until users are individually notified and migrated.'
      tags:
