        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadAccountFileFromUrlRequestInternalServerError'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                url:
                  type: string
                  format: uri
                  description: URL of the file to upload
                name:
                  type: string
                  description: Name of the file
                isArchived:
                  type: boolean
                  default: false
                  description: Whether the file is archived
              required:
              - url
      security:
      - ApiKeyAuth: []
  /files/{file_id}:
    get:
      operationId: files_getFile
      summary: Get File
      description: Retrieve a specific file by id.
      tags:
      - Files
      parameters:
      - name: file_id
        in: path
        description: File identifier
        required: true
        schema:
          type: integer
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/File'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetFileRequestBadRequestError'
        '404':
          description: Resource not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetFileRequestNotFoundError'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetFileRequestInternalServerError'
      security:
      - ApiKeyAuth: []
    patch:
      operationId: files_updateFile
      summary: Update File
      description: 'Rename, archive/unarchive, and/or move a file. Moving isn''t a separate operation — set `folderId` and/or `phaseInstanceId` in the same request.


        Notes:

        - All fields are optional; only fields present in the request body are applied.

        - `folderId` accepts `null` to un-file (remove from its current folder).

        - The target folder must belong to the same project as the file.

        - A file sits in either a folder or the root of a phase, never both. Setting `phaseInstanceId` clears `folderId` (and vice versa) unless you explicitly set both in the same request, which is rejected with `400`.'
      tags:
      - Files
      parameters:
      - name: file_id
        in: path
        description: File identifier
        required: true
        schema:
          type: integer
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FileUpdateResponse'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpdateFileRequestBadRequestError'
        '404':
          description: Resource not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpdateFileRequestNotFoundError'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpdateFileRequestInternalServerError'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  description: New file name
                isActive:
                  type: boolean
                  description: Set to false to archive the file, or true to unarchive it
                folderId:
                  type:
                  - integer
                  - 'null'
                  description: Folder to move the file into. Pass `null` to un-file it.
                phaseInstanceId:
                  type: integer
                  description: Phase instance to move the file to the root of.
      security:
      - ApiKeyAuth: []
    delete:
      operationId: files_deleteFile
      summary: Delete File
      description: Delete a file by id.
      tags:
      - Files
      parameters:
      - name: file_id
        in: path
        description: File identifier
        required: true
        schema:
          type: integer
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Files_deleteFile_Response_200'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeleteFileRequestBadRequestError'
        '404':
          description: Resource not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeleteFileRequestNotFoundError'
      security:
      - ApiKeyAuth: []
  /projects/{project_id}/files/upload:
    post:
      operationId: files_uploadProjectFile
      summary: Create Project File (stream)
      description: 'Upload a file to a project using multipart/form-data


        **File size limit:** Files uploaded through this endpoint are currently capped at **6 MB**. For larger files, upload the file to your own storage using a pre-signed URL and create the file record with **`POST /projects/{project_id}/files`**, passing the file''s URL instead of streaming the bytes.'
      tags:
      - Files
      parameters:
      - name: project_id
        in: path
        required: true
        schema:
          type: string
      - name: name
        in: query
        description: Optional file name to store
        required: false
        schema:
          type: string
      - name: content_type
        in: query
        description: Optional MIME type to associate with the file
        required: false
        schema:
          type: string
      - name: phase_instance_id
        in: query
        description: Optional phase instance id to associate with the file
        required: false
        schema:
          type: integer
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FileUploadResponse'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadProjectFileRequestBadRequestError'
        '404':
          description: Resource not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadProjectFileRequestNotFoundError'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadProjectFileRequestInternalServerError'
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
              required:
              - file
      security:
      - ApiKeyAuth: []
  /opportunities/{opportunity_id}/files/upload:
    post:
      operationId: files_uploadRequestFile
      summary: Create Opportunity File (stream)
      description: 'Upload a file to an opportunity using multipart/form-data


        **Note:** The `/requests` path is an alias for `/opportunities` and will continue to work until users are individually notified and migrated.


        **File size limit:** Files uploaded through this endpoint are currently capped at **6 MB**. For larger files, upload the file to your own storage using a pre-signed URL and create the file record with **`POST /opportunities/{opportunity_id}/files`**, passing the file''s URL instead of streaming the bytes.'
      tags:
