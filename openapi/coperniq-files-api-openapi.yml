    FileMetaDataGps:
      type: object
      properties: {}
      description: GPS coordinates if applicable
      title: FileMetaDataGps
    OpportunitiesOpportunityIdFilesGetResponsesContentApplicationJsonSchemaCode:
      type: string
      enum:
      - INTERNAL_SERVER_ERROR
      title: OpportunitiesOpportunityIdFilesGetResponsesContentApplicationJsonSchemaCode
    GetRequestFileRequestBadRequestError:
      type: object
      properties:
        message:
          type: string
        code:
          $ref: '#/components/schemas/OpportunitiesOpportunityIdFilesFileIdGetResponsesContentApplicationJsonSchemaCode'
