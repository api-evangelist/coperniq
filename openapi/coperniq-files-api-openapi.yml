openapi: 3.2.0
info:
  title: Reference Files API
  version: 1.0.0
servers:
- url: https://api.coperniq.io/v1
  description: Production server
tags:
- name: Files
paths:
  /projects/{projectId}/files:
    get:
      operationId: get-project-files
      summary: Get Project Files
      description: Retrieve all files associated with a project
      tags:
      - Files
      parameters:
      - name: projectId
        in: path
        description: Project identifier
        required: true
        schema:
          type: integer
      - name: x-api-key
        in: header
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/File'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetProjectFilesRequestBadRequestError'
        '404':
          description: Resource not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetProjectFilesRequestNotFoundError'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetProjectFilesRequestInternalServerError'
    post:
      operationId: upload-project-file-from-url
      summary: Create Project File (from URL)
      description: Upload a file to a project by providing its URL
      tags:
      - Files
      parameters:
      - name: projectId
        in: path
        description: Project identifier
        required: true
        schema:
          type: integer
      - name: x-api-key
        in: header
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/File'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadProjectFileFromUrlRequestBadRequestError'
        '404':
          description: Resource not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadProjectFileFromUrlRequestNotFoundError'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadProjectFileFromUrlRequestInternalServerError'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                url:
                  type: string
                  format: uri
                  description: URL of the file to upload
                name:
                  type: string
                  description: Name of the file
                isArchived:
                  type: boolean
                  default: false
                  description: Whether the file is archived
                phaseInstanceId:
                  type: integer
                  description: Optional. The ID of the phase instance to use. If provided, the phase does not need to be started to upload a file. You can gather phase instance ids from the get project endpoint.
              required:
              - url
  /opportunities/{opportunityId}/files:
    get:
      operationId: get-request-files
      summary: Get Opportunity Files
      description: 'Retrieve all files associated with an opportunity


        **Note:** The `/requests` path is an alias for `/opportunities` and will continue to work until users are individually notified and migrated.'
      tags:
      - Files
      parameters:
      - name: opportunityId
        in: path
        description: Opportunity identifier
        required: true
        schema:
          type: integer
      - name: x-api-key
        in: header
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/File'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetRequestFilesRequestBadRequestError'
        '404':
          description: Resource not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetRequestFilesRequestNotFoundError'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetRequestFilesRequestInternalServerError'
    post:
      operationId: upload-request-file-from-url
      summary: Create Opportunity File (from URL)
      description: 'Upload a file to an opportunity by providing its URL


        **Note:** The `/requests` path is an alias for `/opportunities` and will continue to work until users are individually notified and migrated.'
      tags:
      - Files
      parameters:
      - name: opportunityId
        in: path
        description: Opportunity identifier
        required: true
        schema:
          type: integer
      - name: x-api-key
        in: header
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/File'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadRequestFileFromUrlRequestBadRequestError'
        '404':
          description: Resource not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadRequestFileFromUrlRequestNotFoundError'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadRequestFileFromUrlRequestInternalServerError'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                url:
                  type: string
                  format: uri
                  description: URL of the file to upload
                name:
                  type: string
                  description: Name of the file
                isArchived:
                  type: boolean
                  default: false
                  description: Whether the file is archived
                phaseInstanceId:
                  type: integer
                  description: Optional. The ID of the phase instance to use. If provided, the phase does not need to be started to upload a file. You can gather phase instance ids from the get opportunity endpoint.
              required:
              - url
  /projects/{projectId}/files/{fileId}:
    get:
      operationId: get-project-file
      summary: Get Project File
      description: Retrieve a specific file associated with a project
      tags:
      - Files
      parameters:
      - name: projectId
        in: path
        description: Project identifier
        required: true
        schema:
          type: integer
      - name: fileId
        in: path
        description: File identifier
        required: true
        schema:
          type: integer
      - name: x-api-key
        in: header
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/File'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetProjectFileRequestBadRequestError'
        '404':
          description: Resource not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetProjectFileRequestNotFoundError'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetProjectFileRequestInternalServerError'
    delete:
      operationId: delete-project-file
      summary: Delete Project File
      description: Delete a file from a project
      tags:
      - Files
      parameters:
      - name: projectId
        in: path
        description: Project identifier
        required: true
        schema:
          type: integer
      - name: fileId
        in: path
        description: File identifier
        required: true
        schema:
          type: integer
      - name: x-api-key
        in: header
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Files_deleteProjectFile_Response_200'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeleteProjectFileRequestBadRequestError'
        '404':
          description: Resource not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeleteProjectFileRequestNotFoundError'
  /opportunities/{opportunityId}/files/{fileId}:
    get:
      operationId: get-request-file
      summary: Get Opportunity File
      description: 'Retrieve a specific file associated with an opportunity


        **Note:** The `/requests` path is an alias for `/opportunities` and will continue to work until users are individually notified and migrated.'
      tags:
      - Files
      parameters:
      - name: opportunityId
        in: path
        description: Opportunity identifier
        required: true
        schema:
          type: integer
      - name: fileId
        in: path
        description: File identifier
        required: true
        schema:
          type: integer
      - name: x-api-key
        in: header
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/File'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetRequestFileRequestBadRequestError'
        '404':
          description: Resource not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetRequestFileRequestNotFoundError'
    delete:
      operationId: delete-request-file
      summary: Delete Opportunity File
      description: 'Delete a file from an opportunity


        **Note:** The `/requests` path is an alias for `/opportunities` and will continue to work until users are individually notified and migrated.'
      tags:
      - Files
      parameters:
      - name: opportunityId
        in: path
        description: Opportunity identifier
        required: true
        schema:
          type: integer
      - name: fileId
        in: path
        description: File identifier
        required: true
        schema:
          type: integer
      - name: x-api-key
        in: header
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Files_deleteRequestFile_Response_200'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeleteRequestFileRequestBadRequestError'
        '404':
          description: Resource not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeleteRequestFileRequestNotFoundError'
  /projects/{projectId}/files/upload:
    post:
      operationId: upload-project-file
      summary: Create Project File (stream)
      description: Upload a file to a project using multipart/form-data
      tags:
      - Files
      parameters:
      - name: projectId
        in: path
        required: true
        schema:
          type: string
      - name: name
        in: query
        description: Optional file name to store
        required: false
        schema:
          type: string
      - name: content_type
        in: query
        description: Optional MIME type to associate with the file
        required: false
        schema:
          type: string
      - name: phase_instance_id
        in: query
        description: Optional phase instance id to associate with the file
        required: false
        schema:
          type: integer
      - name: x-api-key
        in: header
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FileUploadResponse'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadProjectFileRequestBadRequestError'
        '404':
          description: Resource not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadProjectFileRequestNotFoundError'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadProjectFileRequestInternalServerError'
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
              required:
              - file
  /opportunities/{opportunityId}/files/upload:
    post:
      operationId: upload-request-file
      summary: Create Opportunity File (stream)
      description: 'Upload a file to an opportunity using multipart/form-data


        **Note:** The `/requests` path is an alias for `/opportunities` and will continue to work until users are individually notified and migrated.'
      tags:
