              schema:
                $ref: '#/components/schemas/GetAccountFilesRequestNotFoundError'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetAccountFilesRequestInternalServerError'
      security:
      - ApiKeyAuth: []
    post:
      operationId: files_uploadAccountFileFromUrl
      summary: Create Account File (from URL)
      description: 'Upload a file to an account by providing its URL


        **Note:** The `/clients` path is an alias for `/accounts` and will continue to work until users are individually notified and migrated.'
      tags:
      - Files
      parameters:
      - name: account_id
        in: path
        description: Account identifier
        required: true
        schema:
          type: integer
      responses:
        '200':
          description: Successful response
          content:
            application/json:
