              schema:
                $ref: '#/components/schemas/UploadRequestFileRequestNotFoundError'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadRequestFileRequestInternalServerError'
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
              required:
              - file
components:
  schemas:
    FileUploadResponse:
      type: object
      properties:
        id:
          type: integer
          description: File identifier
        name:
          type: string
          description: File name
        downloadUrl:
          type: string
          description: URL to download the file
        metaData:
          $ref: '#/components/schemas/FileUploadResponseMetaData'
      required:
      - id
      - name
      - downloadUrl
      - metaData
      description: Response returned after a successful file upload.
      title: FileUploadResponse
    GetRequestFileRequestNotFoundError:
      type: object
      properties:
        message:
          type: string
        code:
          $ref: '#/components/schemas/OpportunitiesOpportunityIdFilesFileIdGetResponsesContentApplicationJsonSchemaCode'
      title: GetRequestFileRequestNotFoundError
    UploadRequestFileRequestInternalServerError:
      type: object
      properties:
        message:
          type: string
        code:
          $ref: '#/components/schemas/OpportunitiesOpportunityIdFilesUploadPostResponsesContentApplicationJsonSchemaCode'
      title: UploadRequestFileRequestInternalServerError
    ProjectsProjectIdFilesUploadPostResponsesContentApplicationJsonSchemaCode:
      type: string
      enum:
      - INTERNAL_SERVER_ERROR
      title: ProjectsProjectIdFilesUploadPostResponsesContentApplicationJsonSchemaCode
    UploadRequestFileRequestNotFoundError:
      type: object
      properties:
