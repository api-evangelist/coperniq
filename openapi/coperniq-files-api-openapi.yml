      title: GetRequestFileRequestBadRequestError
    UploadProjectFileRequestNotFoundError:
      type: object
      properties:
        message:
          type: string
        code:
          $ref: '#/components/schemas/ProjectsProjectIdFilesUploadPostResponsesContentApplicationJsonSchemaCode'
      title: UploadProjectFileRequestNotFoundError
    UploadProjectFileRequestBadRequestError:
      type: object
      properties:
        message:
          type: string
        code:
          $ref: '#/components/schemas/ProjectsProjectIdFilesUploadPostResponsesContentApplicationJsonSchemaCode'
        field:
          type: string
          description: Field that caused the validation error (if applicable)
      title: UploadProjectFileRequestBadRequestError
    FileCreatedByUser:
      type: object
      properties:
        id:
          type: integer
          description: User identifier
        firstName:
          type: string
          description: User's first name
        lastName:
          type: string
          description: User's last name
      title: FileCreatedByUser
    File:
      type: object
      properties:
        id:
          type: integer
          description: File identifier
        name:
          type: string
          description: File name
        downloadUrl:
          type: string
          description: URL to download the file
        type:
          type: string
          description: File type
        updatedAt:
          type: string
          format: date-time
          description: Last update timestamp
        createdAt:
          type: string
          format: date-time
          description: Creation timestamp
        isArchived:
          type: boolean
          description: Whether the file is archived
        metaData:
          $ref: '#/components/schemas/FileMetaData'
        source:
          type: string
          description: File source (e.g., INTERNAL)
        createdByUser:
          $ref: '#/components/schemas/FileCreatedByUser'
      required:
