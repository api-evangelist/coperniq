          description: User who uploaded the file
        mimeType:
          type: string
          description: MIME type of the file
        extention:
          type: string
          description: File extension
        originalName:
          type: string
          description: Original file name
        thumbnailUrl:
          type: string
          description: URL to the thumbnail version
        generatedName:
          type: string
          description: Generated unique file name
        thumbnailName:
          type: string
          description: Generated thumbnail file name
        requestFileName:
          type: string
          description: Original request file name
      required:
