openapi: 3.2.0
info:
  title: Reference Forms API
  version: 1.0.0
servers:
- url: https://api.coperniq.io/v1
  description: Production server
tags:
- name: Forms
paths:
  /projects/{project_id}/forms:
    get:
      operationId: forms_listProjectForms
      summary: List Project Forms
      description: 'Retrieve all forms associated with a project.


        Supports:

        - Status filtering (`status` query parameter)'
      tags:
      - Forms
      parameters:
      - name: project_id
        in: path
        description: Project identifier
        required: true
        schema:
          type: integer
      - name: status
        in: query
        description: Filter forms by status
        required: false
        schema:
          $ref: '#/components/schemas/ProjectsProjectIdFormsGetParametersStatus'
      responses:
        '200':
          description: List of forms
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Form'
        '401':
          description: Authentication failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListProjectFormsRequestUnauthorizedError'
      security:
      - ApiKeyAuth: []
    post:
      operationId: forms_createProjectForm
      summary: Create Project Form
      description: 'Create a new form instance in a project.


        Notes:

        - `templateId` is required.

        - The form is created using its template''s name. `name` is not accepted here — use `PATCH /forms/{form_id}` to rename it afterward.

        - `phaseInstanceId` is optional, but if provided the referenced phase must be started (active) for creation to succeed.'
      tags:
      - Forms
      parameters:
      - name: project_id
        in: path
        description: Project identifier
        required: true
        schema:
          type: integer
      responses:
        '201':
          description: Form created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Forms_createProjectForm_Response_201'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateProjectFormRequestBadRequestError'
        '401':
          description: Authentication failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateProjectFormRequestUnauthorizedError'
        '404':
          description: Resource not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateProjectFormRequestNotFoundError'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                templateId:
                  type: integer
                  description: Template to use for the form
                phaseInstanceId:
                  type: integer
                  description: Optional. Phase instance id where the form will be created (phase must be started). You can gather phase instance ids from the Get Project endpoint.
              required:
              - templateId
      security:
      - ApiKeyAuth: []
  /opportunities/{opportunity_id}/forms:
    get:
      operationId: forms_listOpportunityForms
      summary: List Opportunity Forms
      description: 'Retrieve all forms associated with an opportunity.


        Supports:

        - Status filtering (`status` query parameter)


        **Note:** The `/requests` path is an alias for `/opportunities` and will continue to work until users are individually notified and migrated.'
      tags:
      - Forms
      parameters:
      - name: opportunity_id
        in: path
        description: Opportunity identifier
        required: true
        schema:
          type: integer
      - name: status
        in: query
        description: Filter forms by status
        required: false
        schema:
          $ref: '#/components/schemas/OpportunitiesOpportunityIdFormsGetParametersStatus'
      responses:
        '200':
          description: List of forms
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/OpportunityForm'
        '401':
          description: Authentication failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListOpportunityFormsRequestUnauthorizedError'
      security:
      - ApiKeyAuth: []
    post:
      operationId: forms_createOpportunityForm
      summary: Create Opportunity Form
      description: 'Create a new form instance in an opportunity.


        Notes:

        - `templateId` is required.

        - `name` is optional; defaults to the template''s name.

        - Opportunities cannot be assigned to a phase, so there is no `phaseInstanceId` field on this endpoint.'
      tags:
      - Forms
      parameters:
      - name: opportunity_id
        in: path
        description: Opportunity identifier
        required: true
        schema:
          type: integer
      responses:
        '201':
          description: Form created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Forms_createOpportunityForm_Response_201'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateOpportunityFormRequestBadRequestError'
        '401':
          description: Authentication failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateOpportunityFormRequestUnauthorizedError'
        '404':
          description: Resource not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateOpportunityFormRequestNotFoundError'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                templateId:
                  type: integer
                  description: Template to use for the form
                name:
                  type: string
                  description: Optional. Name for the created form. Defaults to the template's name.
              required:
              - templateId
      security:
      - ApiKeyAuth: []
  /forms/{form_id}:
    get:
      operationId: forms_getForm
      summary: Get Form
      description: Retrieve a specific form by ID with detailed layout information
      tags:
      - Forms
      parameters:
      - name: form_id
        in: path
        description: Form identifier
        required: true
        schema:
          type: integer
      responses:
        '200':
          description: Form details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FormDetail'
        '401':
          description: Authentication failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetFormRequestUnauthorizedError'
        '404':
          description: Resource not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetFormRequestNotFoundError'
      security:
      - ApiKeyAuth: []
    patch:
      operationId: forms_updateForm
      summary: Update Form
      description: 'Update an existing form, including core fields (status, due dates, assignee, collaborators)

        and individual field responses.'
      tags:
      - Forms
      parameters:
      - name: form_id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Updated form details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FormDetail'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpdateFormRequestBadRequestError'
        '401':
          description: Authentication failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpdateFormRequestUnauthorizedError'
        '404':
          description: Resource not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpdateFormRequestNotFoundError'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FormUpdate'
      security:
      - ApiKeyAuth: []
  /work-orders/{work_order_id}/forms:
    post:
      operationId: forms_createWorkOrderForm
      summary: Create Work Order Form
      description: 'Create a new form instance on a work order.


        Notes:

        - `templateId` is required.

        - The form is created using its template''s name. `name` is not accepted here — use `PATCH /forms/{form_id}` to rename it afterward.

        - A work order already sits in a phase, so `phaseInstanceId` is not accepted on this endpoint — the form inherits placement via its parent element instance.'
      tags:
      - Forms
      parameters:
      - name: work_order_id
        in: path
        description: Work order identifier
        required: true
        schema:
          type: integer
      responses:
        '201':
          description: Form created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Forms_createWorkOrderForm_Response_201'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateWorkOrderFormRequestBadRequestError'
        '401':
          description: Authentication failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateWorkOrderFormRequestUnauthorizedError'
        '404':
          description: Resource not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateWorkOrderFormRequestNotFoundError'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateWorkOrderFormRequestInternalServerError'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                templateId:
                  type: integer
                  description: Template to use for the form
              required:
              - templateId
      security:
      - ApiKeyAuth: []
  /forms/{form_id}/fields/file-from-url:
    post:
      operationId: forms_attachFileToFormFieldFromUrl
      summary: Attach file to form field from URL
      description: Uploads a file from a public URL into Coperniq and attaches it to a specific FILE-type field on the form.
      tags:
      - Forms
      parameters:
      - name: form_id
        in: path
        description: Form identifier
        required: true
        schema:
          type: integer
      responses:
        '200':
          description: File uploaded and attached successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Forms_attachFileToFormFieldFromUrl_Response_200'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AttachFileToFormFieldFromUrlRequestBadRequestError'
        '401':
          description: Authentication failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AttachFileToFormFieldFromUrlRequestUnauthorizedError'
        '404':
          description: Resource not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AttachFileToFormFieldFromUrlRequestNotFoundError'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                columnId:
                  type: integer
                  description: ID of the FILE-type field to attach the uploaded file to.
                url:
                  type: string
                  format: uri
                  description: Public URL of the file to upload.
                name:
                  type: string
                  description: Optional display name for the uploaded file.
                projectId:
                  type: integer
                  description: Optional project ID to associate with the file. This will add the file to the project's 'Docs' section at the root level.
                action:
                  $ref: '#/components/schemas/FormsFormIdFieldsFileFromUrlPostRequestBodyContentApplicationJsonSchemaAction'
                  description: Whether to append to existing files (add) or replace them entirely (replace). Defaults to add.
              required:
              - columnId
              - url
      security:
      - ApiKeyAuth: []
  /forms/{form_id}/pdf:
    post:
      operationId: forms_getFormPdf
      summary: Export Form as PDF
      description: Export a form to PDF. All body fields are optional.
      tags:
      - Forms
      parameters:
      - name: form_id
        in: path
        description: Form identifier
        required: true
        schema:
          type: integer
      responses:
        '200':
          description: PDF generated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Forms_getFormPdf_Response_200'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetFormPdfRequestBadRequestError'
        '401':
          description: Authentication failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetFormPdfRequestUnauthorizedError'
        '404':
          description: Resource not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetFormPdfRequestNotFoundError'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetFormPdfRequestInternalServerError'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                imagesOnly:
                  type: boolean
                  description: Export only the form's image fields, omitting other field types. Defaults to false.
                imagesInRow:
                  $ref: '#/components/schemas/FormsFormIdPdfPostRequestBodyContentApplicationJsonSchemaImagesInRow'
                  description: Number of images to lay out per row. Defaults to 2.
                includeImageMetadata:
                  type: boolean
                  description: Include image metadata (e.g. GPS, timestamp) below each image. Defaults to true.
      security:
      - ApiKeyAuth: []
components:
  schemas:
    FormFile:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        downloadUrl:
          type: string
        metaData:
          type: object
          additionalProperties:
            description: Any type
      title: FormFile
    Forms_attachFileToFormFieldFromUrl_Response_200:
      type: object
      properties:
        success:
          type: boolean
        fileId:
          type: integer
        formId:
          type: integer
        columnId:
          type: integer
        projectId:
          type:
          - integer
          - 'null'
        action:
          type: string
      title: Forms_attachFileToFormFieldFromUrl_Response_200
    FormsFormIdFieldsFileFromUrlPostResponsesContentApplicationJsonSchemaCode:
      type: string
      enum:
      - NOT_FOUND
      title: FormsFormIdFieldsFileFromUrlPostResponsesContentApplicationJsonSchemaCode
    GetFormPdfRequestInternalServerError:
      type: object
      properties:
        message:
          type: string
        code:
          $ref: '#/components/schemas/FormsFormIdPdfPostResponsesContentApplicationJsonSchemaCode'
      title: GetFormPdfRequestInternalServerError
    CreateProjectFormRequestBadRequestError:
      type: object
      properties:
        message:
          type: string
        code:
          $ref: '#/components/schemas/ProjectsProjectIdFormsPostResponsesContentApplicationJsonSchemaCode'
        field:
          type: string
          description: Field that caused the validation error (if applicable)
      title: CreateProjectFormRequestBadRequestError
    FormUpdateFieldsItemsValue:
      oneOf:
      - type: string
      - type: number
        format: double
      - type: boolean
      - $ref: '#/components/schemas/FormUpdateArrayValue'
      description: New value for the field
      title: FormUpdateFieldsItemsValue
    FormDetail:
      type: object
      properties:
        id:
          type: integer
          description: Form identifier
        name:
          type: string
          description: Form name
        description:
          type:
          - string
          - 'null'
          description: Form description
        templateId:
          type:
          - integer
          - 'null'
          description: Template ID
        updatedAt:
          type: string
          format: date-time
          description: Last update timestamp
        status:
          $ref: '#/components/schemas/FormDetailStatus'
          description: Form status
        isCompleted:
          type: boolean
          description: Whether the form is completed
        completedAt:
          type:
          - string
          - 'null'
          format: date-time
          description: Completion timestamp
        createdAt:
          type: string
          format: date-time
          description: Creation timestamp
        createdByUser:
          $ref: '#/components/schemas/UserSummary'
        assignee:
          $ref: '#/components/schemas/UserSummary'
        dueDate:
          type:
          - string
          - 'null'
          format: date-time
          description: Due date
        projectId:
          type: integer
          description: Associated project ID
        phaseId:
          type:
          - integer
          - 'null'
          description: Phase template ID (if available)
        phaseName:
          type:
          - string
          - 'null'
          description: Phase template name (if available)
        formLayouts:
          type: array
          items:
            $ref: '#/components/schemas/FormLayoutGroup'
          description: Form layout sections
        collaborators:
          type: array
          items:
            $ref: '#/components/schemas/UserSummary'
          description: Additional users collaborating on the form
      title: FormDetail
    CreateWorkOrderFormRequestUnauthorizedError:
      type: object
      properties:
        message:
          type: string
        code:
          $ref: '#/components/schemas/WorkOrdersWorkOrderIdFormsPostResponsesContentApplicationJsonSchemaCode'
      title: CreateWorkOrderFormRequestUnauthorizedError
    AttachFileToFormFieldFromUrlRequestUnauthorizedError:
      type: object
      properties:
        message:
          type: string
        code:
          $ref: '#/components/schemas/FormsFormIdFieldsFileFromUrlPostResponsesContentApplicationJsonSchemaCode'
      title: AttachFileToFormFieldFromUrlRequestUnauthorizedError
    OpportunitiesOpportunityIdFormsGetParametersStatus:
      type: string
      enum:
      - UNASSIGNED
      - ASSIGNED
      - REVIEW
      - CHANGES_REQUESTED
      - COMPLETED
      - CANCELLED
      title: OpportunitiesOpportunityIdFormsGetParametersStatus
    FormField:
      type: object
      properties:
        id:
          type: integer
          description: Child form layout identifier
        columnId:
          type: integer
          description: Column identifier on the form layout
        name:
          type: string
          description: Field label
        type:
          type: string
          description: Field type
        value:
          oneOf:
          - $ref: '#/components/schemas/FormFieldValue'
          - type: 'null'
          description: Normalized field value
      title: FormField
    OpportunityFormStatus:
      type: string
      enum:
      - UNASSIGNED
      - ASSIGNED
      - REVIEW
      - CHANGES_REQUESTED
      - COMPLETED
      - CANCELLED
      description: Form status
      title: OpportunityFormStatus
    ProjectsProjectIdFormsPostResponsesContentApplicationJsonSchemaCode:
      type: string
      enum:
      - NOT_FOUND
      title: ProjectsProjectIdFormsPostResponsesContentApplicationJsonSchemaCode
    FormsFormIdPdfPostResponsesContentApplicationJsonSchemaCode:
      type: string
      enum:
      - INTERNAL_SERVER_ERROR
      title: FormsFormIdPdfPostResponsesContentApplicationJsonSchemaCode
    FormsFormIdPdfPostRequestBodyContentApplicationJsonSchemaImagesInRow:
      type: string
      enum:
      - '0'
      - '1'
      - '2'
      - '3'
      - '4'
      - '5'
      - '6'
      description: Number of images to lay out per row. Defaults to 2.
      title: FormsFormIdPdfPostRequestBodyContentApplicationJsonSchemaImagesInRow
    Forms_createProjectForm_Response_201:
      type: object
      properties:
        id:
          type: integer
          description: Created form identifier
        templateId:
          type: integer
        phaseInstanceId:
          type: integer
        projectId:
          type: integer
        type:
          type: string
        status:
          type: string
        name:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      title: Forms_createProjectForm_Response_201
    FormUpdateFieldsItems:
      type: object
      properties:
        columnId:
          type: integer
          description: Column identifier on the form
        value:
          oneOf:
          - $ref: '#/components/schemas/FormUpdateFieldsItemsValue'
          - type: 'null'
          description: New value for the field
      required:
      - columnId
      title: FormUpdateFieldsItems
    FormUpdateItemsValue:
      oneOf:
      - type: string
      - type: number
        format: double
      - type: boolean
      - $ref: '#/components/schemas/FormUpdateArrayValue'
      description: New value for the field
      title: FormUpdateItemsValue
    CreateProjectFormRequestNotFoundError:
      type: object
      properties:
        message:
          type: string
        code:
          $ref: '#/components/schemas/ProjectsProjectIdFormsPostResponsesContentApplicationJsonSchemaCode'
      title: CreateProjectFormRequestNotFoundError
    UpdateFormRequestBadRequestError:
      type: object
      properties:
        message:
          type: string
        code:
          $ref: '#/components/schemas/FormsFormIdPatchResponsesContentApplicationJsonSchemaCode'
        field:
          type: string
          description: Field that caused the validation error (if applicable)
      title: UpdateFormRequestBadRequestError
    OpportunityForm:
      type: object
      properties:
        id:
          type: integer
          description: Form identifier
        name:
          type: string
          description: Form name
        description:
          type:
          - string
          - 'null'
          description: Form description
        isCompleted:
          type: boolean
          description: Whether the form is completed
        createdBy:
          type: integer
          description: ID of user who created the form
        createdAt:
          type: string
          format: date-time
          description: Creation timestamp
        updatedAt:
          type: string
          format: date-time
          description: Last update timestamp
        templateId:
          type:
          - integer
          - 'null'
          description: Template ID
        status:
          $ref: '#/components/schemas/OpportunityFormStatus'
          description: Form status
        dueDate:
          type:
          - string
          - 'null'
          format: date-time
          description: Due date
        completedAt:
          type:
          - string
          - 'null'
          format: date-time
          description: Completion timestamp
        assignee:
          $ref: '#/components/schemas/UserSummary'
        requestId:
          type: integer
          description: Associated opportunity ID
        collaborators:
          type: array
          items:
            $ref: '#/components/schemas/UserSummary'
          description: Additional users collaborating on the form
      title: OpportunityForm
    FormsFormIdFieldsFileFromUrlPostRequestBodyContentApplicationJsonSchemaAction:
      type: string
      enum:
      - add
      - replace
      description: Whether to append to existing files (add) or replace them entirely (replace). Defaults to add.
      title: FormsFormIdFieldsFileFromUrlPostRequestBodyContentApplicationJsonSchemaAction
    OpportunitiesOpportunityIdFormsPostResponsesContentApplicationJsonSchemaCode:
      type: string
      enum:
      - NOT_FOUND
      title: OpportunitiesOpportunityIdFormsPostResponsesContentApplicationJsonSchemaCode
    FormUpdate:
      type: object
      properties:
        name:
          type: string
          description: Form name
        description:
          type:
          - string
          - 'null'
          description: Form description
        assigneeId:
          type: integer
          description: Primary assignee user ID
        dueDate:
          type: string
          format: date-time
          description: Absolute due date (ISO 8601)
        status:
          $ref: '#/components/schemas/FormUpdateStatus'
          description: Form status
        labels:
          type: array
          items:
            type: integer
          description: Label IDs applied to the form
        collaborators:
          type: array
          items:
            type: integer
          description: Collaborator user IDs
        properties:
          type: array
          items:
            $ref: '#/components/schemas/FormUpdateItems'
          description: Individual field/column updates.
        fields:
          type: array
          items:
            $ref: '#/components/schemas/FormUpdateFieldsItems'
          description: Deprecated alias for properties. Accepted for backwards compatibility — new integrations should use properties.
          deprecated: true
      description: Payload for updating a form via the public API.
      title: FormUpdate
    CreateProjectFormRequestUnauthorizedError:
      type: object
      properties:
        message:
          type: string
        code:
          $ref: '#/components/schemas/ProjectsProjectIdFormsPostResponsesContentApplicationJsonSchemaCode'
      title: CreateProjectFormRequestUnauthorizedError
    GetFormPdfRequestBadRequestError:
      type: object
      properties:
        message:
          type: string
        code:
          $ref: '#/components/schemas/FormsFormIdPdfPostResponsesContentApplicationJsonSchemaCode'
        field:
          type: string
          description: Field that caused the validation error (if applicable)
      title: GetFormPdfRequestBadRequestError
    ProjectsProjectIdFormsGetResponsesContentApplicationJsonSchemaCode:
      type: string
      enum:
      - UNAUTHORIZED
      title: ProjectsProjectIdFormsGetResponsesContentApplicationJsonSchemaCode
    CreateWorkOrderFormRequestInternalServerError:
      type: object
      properties:
        message:
          type: string
        code:
          $ref: '#/components/schemas/WorkOrdersWorkOrderIdFormsPostResponsesContentApplicationJsonSchemaCode'
      title: CreateWorkOrderFormRequestInternalServerError
    Forms_createWorkOrderForm_Response_201:
      type: object
      properties:
        id:
          type: integer
          description: Created form identifier
        templateId:
          type: integer
        workOrderId:
          type: integer
        projectId:
          type: integer
        phaseInstanceId:
          type: integer
        phaseTemplateId:
          type: integer
        type:
          type: string
        status:
          type: string
        name:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      title: Forms_createWorkOrderForm_Response_201
    ProjectsProjectIdFormsGetParametersStatus:
      type: string
      enum:
      - UNASSIGNED
      - ASSIGNED
      - REVIEW
      - CHANGES_REQUESTED
      - COMPLETED
      - CANCELLED
      title: ProjectsProjectIdFormsGetParametersStatus
    FormUpdateArrayValueItems:
      oneOf:
      - type: string
      - type: number
        format: double
      - type: boolean
      title: FormUpdateArrayValueItems
    CreateOpportunityFormRequestUnauthorizedError:
      type: object
      properties:
        message:
          type: string
        code:
          $ref: '#/components/schemas/OpportunitiesOpportunityIdFormsPostResponsesContentApplicationJsonSchemaCode'
      title: CreateOpportunityFormRequestUnauthorizedError
    CreateWorkOrderFormRequestNotFoundError:
      type: object
      properties:
        message:
          type: string
        code:
          $ref: '#/components/schemas/WorkOrdersWorkOrderIdFormsPostResponsesContentApplicationJsonSchemaCode'
      title: CreateWorkOrderFormRequestNotFoundError
    ListProjectFormsRequestUnauthorizedError:
      type: object
      properties:
        message:
          type: string
        code:
