        name:
          type: string
        downloadUrl:
          type: string
        metaData:
          type: object
          additionalProperties:
            description: Any type
      title: FormFile
    OpportunityForm:
      type: object
      properties:
        id:
          type: integer
          description: Form identifier
        name:
          type: string
          description: Form name
        description:
          type:
          - string
          - 'null'
          description: Form description
        isCompleted:
          type: boolean
          description: Whether the form is completed
        createdBy:
          type: integer
          description: ID of user who created the form
        createdAt:
          type: string
          format: date-time
          description: Creation timestamp
        updatedAt:
          type: string
          format: date-time
          description: Last update timestamp
        templateId:
          type:
          - integer
          - 'null'
          description: Template ID
        status:
          $ref: '#/components/schemas/OpportunityFormStatus'
          description: Form status
        dueDate:
          type:
          - string
          - 'null'
          format: date-time
          description: Due date
        completedAt:
          type:
          - string
          - 'null'
          format: date-time
          description: Completion timestamp
        assignee:
          $ref: '#/components/schemas/UserSummary'
        requestId:
          type: integer
          description: Associated opportunity ID
        collaborators:
          type: array
          items:
            $ref: '#/components/schemas/UserSummary'
          description: Additional users collaborating on the form
      title: OpportunityForm
    FormsFormIdFieldsFileFromUrlPostRequestBodyContentApplicationJsonSchemaAction:
      type: string
