openapi: 3.2.0
info:
  title: Reference Users API
  version: 1.0.0
servers:
- url: https://api.coperniq.io/v1
  description: Production server
tags:
- name: Users
paths:
  /users:
    get:
      operationId: users_listUsers
      summary: List Users
      description: Retrieve a list of users
      tags:
      - Users
      parameters:
      - name: email
        in: query
        description: Email of the user to search for
        required: false
        schema:
          type: string
      - name: id
        in: query
        description: ID of the user to search for
        required: false
        schema:
          type: integer
      responses:
        '200':
          description: List of users
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/User'
      security:
      - ApiKeyAuth: []
    post:
      operationId: users_inviteUser
      summary: Invite User
      description: Invite a new user to the organization
      tags:
      - Users
      responses:
        '201':
          description: User invited successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Users_inviteUser_Response_201'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserInvite'
      security:
      - ApiKeyAuth: []
  /roles:
    get:
      operationId: users_listRoles
      summary: List Roles
      description: Retrieve available user roles
      tags:
      - Users
      responses:
        '200':
          description: List of roles
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Role'
      security:
      - ApiKeyAuth: []
  /teams:
    get:
      operationId: users_listTeams
      summary: List Teams
      description: Retrieve available teams
      tags:
      - Users
      responses:
        '200':
          description: List of teams
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Team'
      security:
      - ApiKeyAuth: []
components:
  schemas:
    TeamMemberRole:
      type: object
      properties:
        id:
          type: string
          description: Role identifier
        name:
          type: string
          description: Role name
      title: TeamMemberRole
    TeamMember:
      type: object
      properties:
        id:
          type: integer
          description: Unique identifier
        firstName:
          type: string
          description: First name
        lastName:
          type: string
          description: Last name
        email:
          type: string
          format: email
          description: Email address
        phone:
          type: string
          description: Phone number
        role:
          $ref: '#/components/schemas/TeamMemberRole'
        isTeamLead:
          type: boolean
          description: Indicates whether this user is the lead for the team.
      required:
      - id
      - firstName
      - lastName
      - email
      - role
      title: TeamMember
    UserRole:
      type: object
      properties:
        id:
          type: string
          description: Role identifier
        name:
          type: string
          description: Role name
      title: UserRole
    User:
      type: object
      properties:
        id:
          type: integer
          description: Unique identifier
        firstName:
          type: string
          description: First name
        lastName:
          type: string
          description: Last name
        email:
          type: string
          format: email
          description: Email address
        phone:
          type: string
          description: Phone number
        role:
          $ref: '#/components/schemas/UserRole'
      required:
      - id
      - firstName
      - lastName
      - email
      - role
      title: User
    Users_inviteUser_Response_201:
      type: object
      properties:
        email:
          type: string
          format: email
        status:
          type: string
      title: Users_inviteUser_Response_201
    UserInvite:
      type: object
      properties:
        email:
          type: string
          format: email
          description: Email address of user to invite
        firstName:
          type: string
          description: User's first name
        lastName:
          type: string
          description: User's last name
        roleIds:
          type: array
          items:
            type: integer
          description: Role IDs to assign to the user
        phone:
          type: string
          description: User's phone number
      required:
      - email
      - firstName
      - lastName
      - roleIds
      title: UserInvite
    Role:
      type: object
      properties:
        id:
          type: string
          description: Unique identifier
        name:
          type: string
          description: Role name
        active:
          type: boolean
          description: Whether the role is active
      required:
      - id
      - name
      - active
      title: Role
    Team:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        workers:
          type: array
          items:
            $ref: '#/components/schemas/TeamMember'
      title: Team
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: x-api-key
x-provenance:
  method: harvested
  publisher: Coperniq
  source: https://docs.coperniq.io/openapi/api-reference.yaml
