openapi: 3.2.0
info:
  title: Reference Opportunities API
  version: 1.0.0
servers:
- url: https://api.coperniq.io/v1
  description: Production server
tags:
- name: Opportunities
paths:
  /opportunities:
    get:
      operationId: opportunities_listOpportunities
      summary: List Opportunities
      description: 'Retrieve a paginated list of opportunities.


        Supports:

        - Pagination (`page_size`, `page`)

        - Date filtering (`updated_after`, `updated_before`)

        - Phase entry/exit date filtering (`entered_phase_id`+`entered_after`/`entered_before`, `exited_phase_id`+`exited_after`/`exited_before`)

        - Sorting (`order_by`, default: desc)

        - Field search (`title`, `address`, `primaryName`, `primaryPhone`, `primaryEmail`)

        - Full text search (`q`)


        **Note:** The `/requests` path is an alias for `/opportunities` and will continue to work until users are individually notified and migrated.


        **Note:** If an opportunity has no `title` (empty or whitespace-only), the response returns the parent account''s `title` instead. The stored value is not modified — this is a read-time fallback only.


        **Note:** `entered_phase_id`/`exited_phase_id` identify a phase *template* (shared across all deals on a workflow), not a specific phase instance. Use the `phaseTemplateId` from a `GET /opportunities/{opportunity_id}` response or the `GET /workflows` response to find the id for a given phase (e.g. "Closed - Won"). When either filter is used, each row also includes a compact `phaseTimeline` (`phaseTemplateId`, `startedAt`, `completedAt`); use `GET /opportunities/{opportunity_id}` for the full `phaseInstances` with names/positions/SLA.'
      tags:
      - Opportunities
      parameters:
      - name: page_size
        in: query
        description: Number of items per page (max 100)
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 20
      - name: page
        in: query
        description: Page number (1-based)
        required: false
        schema:
          type: integer
          minimum: 1
          default: 1
      - name: updated_after
        in: query
        description: Filter items updated after this timestamp (ISO 8601). Also matches records whose custom property values changed within the window.
        required: false
        schema:
          $ref: '#/components/schemas/OpportunitiesGetParametersUpdatedAfter'
      - name: updated_before
        in: query
        description: Filter items updated before this timestamp (ISO 8601). Also matches records whose custom property values changed within the window.
        required: false
        schema:
          $ref: '#/components/schemas/OpportunitiesGetParametersUpdatedBefore'
      - name: entered_phase_id
        in: query
        description: 'Phase template ID to filter by phase-entry date. Required when `entered_after` or `entered_before` is provided. Given alone (no date bounds), matches records that ever entered this phase.

          '
        required: false
        schema:
          type: integer
      - name: entered_after
        in: query
        description: 'Only include records that entered the phase given by `entered_phase_id` on or after this date/timestamp. Accepts a date (`2026-07-01`) or a full ISO 8601 timestamp (`2026-07-01T00:00:00Z`). Requires `entered_phase_id`.

          '
        required: false
        schema:
          type: string
      - name: entered_before
        in: query
        description: 'Only include records that entered the phase given by `entered_phase_id` before this date/timestamp (exclusive). Accepts a date (`2026-08-01`) or a full ISO 8601 timestamp (`2026-08-01T00:00:00Z`). Requires `entered_phase_id`.

          '
        required: false
        schema:
          type: string
      - name: exited_phase_id
        in: query
        description: 'Phase template ID to filter by phase-exit date. Required when `exited_after` or `exited_before` is provided. Given alone (no date bounds), matches records that have exited this phase at any point.

          '
        required: false
        schema:
          type: integer
      - name: exited_after
        in: query
        description: 'Only include records that exited the phase given by `exited_phase_id` on or after this date/timestamp. Accepts a date (`2026-07-01`) or a full ISO 8601 timestamp (`2026-07-01T00:00:00Z`). Requires `exited_phase_id`.

          '
        required: false
        schema:
          type: string
      - name: exited_before
        in: query
        description: 'Only include records that exited the phase given by `exited_phase_id` before this date/timestamp (exclusive). Accepts a date (`2026-08-01`) or a full ISO 8601 timestamp (`2026-08-01T00:00:00Z`). Requires `exited_phase_id`. On opportunities, combine with `exited_phase_id` set to a "Closed - Won"-style phase template to find deals that closed within a date range.

          '
        required: false
        schema:
          type: string
      - name: order_by
        in: query
        description: Sort order for results
        required: false
        schema:
          $ref: '#/components/schemas/OpportunitiesGetParametersOrderBy'
      - name: include_virtual_properties
        in: query
        description: Whether to include virtual properties in the response. Defaults to false unless explicitly set to true.
        required: false
        schema:
          type: boolean
          default: false
      - name: include_archived
        in: query
        description: Whether to include archived (inactive) records in the response. By default only active records are returned.
        required: false
        schema:
          type: boolean
          default: false
      - name: include_contacts
        in: query
        description: Whether to include associated contacts in the response. Defaults to false unless explicitly set to true.
        required: false
        schema:
          type: boolean
          default: false
      - name: q
        in: query
        description: Full text search query
        required: false
        schema:
          type: string
      - name: title
        in: query
        description: Title search query
        required: false
        schema:
          type: string
      - name: address
        in: query
        description: Address search query
        required: false
        schema:
          type: string
      - name: primaryName
        in: query
        description: Contact name search query
        required: false
        schema:
          type: string
      - name: primaryPhone
        in: query
        description: Contact phone search query
        required: false
        schema:
          type: string
      - name: primaryEmail
        in: query
        description: Contact email search query
        required: false
        schema:
          type: string
      responses:
        '200':
          description: List of opportunities
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Opportunity'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListOpportunitiesRequestBadRequestError'
        '401':
          description: Authentication failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListOpportunitiesRequestUnauthorizedError'
      security:
      - ApiKeyAuth: []
    post:
      operationId: opportunities_createOpportunity
      summary: Create Opportunity
      description: 'Create a new opportunity with required and optional fields.


        Required fields:

        - `title`: Opportunity title/name

        - `address`: Opportunity location

        - `trades`: Array of trade types


        Optional fields:

        - `accountId`: Link to existing account

        - `workflowId`: Link to workflow

        - `phaseId`: Link to phase

        - `value`: Opportunity value

        - `size`: Opportunity size

        - `confidence`: Confidence score (0-100)

        - `primaryEmail`/`primaryPhone`: Contact information

        - `contacts`: Contact IDs only (no name, email, phone, etc.). The contacts must be created first via POST /contacts.

        - `custom`: Custom fields object


        Note: If primaryEmail or primaryPhone is provided, a contact will be automatically created or matched.


        **Note:** The `/requests` path is an alias for `/opportunities` and will continue to work until users are individually notified and migrated.'
      tags:
      - Opportunities
      parameters:
      - name: allow_new_options
        in: query
        description: Whether to allow creation of new dropdown options during record creation
        required: false
        schema:
          type: boolean
          default: false
      - name: match_by
        in: query
        description: Field to use for matching existing records
        required: false
        schema:
          $ref: '#/components/schemas/OpportunitiesPostParametersMatchBy'
      - name: match_found_strategy
        in: query
        description: Strategy to use when a match is found
        required: false
        schema:
          $ref: '#/components/schemas/OpportunitiesPostParametersMatchFoundStrategy'
      responses:
        '200':
          description: Matching opportunity found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Opportunity'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateOpportunityRequestBadRequestError'
        '401':
          description: Authentication failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateOpportunityRequestUnauthorizedError'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OpportunityUpsert'
      security:
      - ApiKeyAuth: []
  /opportunities/search:
    get:
      operationId: opportunities_searchOpportunities
      summary: Search Opportunities
      description: 'Search opportunities using up to two filters (prop1/op1/value1 and optionally prop2/op2/value2), combined with `logic` (AND/OR).


        Properties:

        - `propX` can be a standard field (e.g., `status`, `title`, `city`, `type`, `accountId`, etc.) or a custom property key name.

        - Use the `property key` from your company settings.

        - Filter by parent account with `accountId`. `clientId` is accepted as a deprecated alias for backwards compatibility.


        Operators (`opX`):

        - Equality: `eq`, `neq`

        - Numeric/datetime comparisons: `gt`, `gte`, `lt`, `lte`

        - Text/string matching: `contains` (case-insensitive)

        - Lists: `in`, `nin` (CSV list in `valueX`)

        - Ranges: `between` (use `valueX` as `from,to`)

        - Existence: `exists` is not supported for custom properties due to performance limitations. Use `eq` or `neq` instead.

        - `status` has a fixed set of values, so it supports only `eq`, `neq`, `in`, and `nin`.


        Value formats:

        - `in`/`nin`: lists can be provided as:

        - Plain CSV: `value1=OPEN,ACTIVE`

        - Quoted CSV (to include commas inside a value): `value1="Last, First",Other`

        - JSON array: `value1=["Last, First","Other"]`

        - `between`: `from,to` (e.g., `value1=2025-01-01,2025-12-31` or `value1=10,20`)

        - Dates should be ISO 8601 strings; numeric-like values on custom properties are matched against both numeric and text representations.


        Examples:

        - status equals ACTIVE: `?prop1=status&op1=eq&value1=ACTIVE`

        - won or lost: `?prop1=status&op1=in&value1=WON,LOST` (opportunity status is `ACTIVE`, `ON_HOLD`, `WON`, or `LOST`)

        - custom id equals 1234: `?prop1=legacy_tool_project_id&op1=eq&value1=1234`

        - title contains "Solar": `?prop1=name&op1=contains&value1=Solar`

        - status IN (ACTIVE, ON_HOLD) AND city = Austin: `?prop1=status&op1=in&value1=ACTIVE,ON_HOLD&logic=and&prop2=city&op2=eq&value2=Austin`


        **Note:** The `/requests` path is an alias for `/opportunities` and will continue to work until users are individually notified and migrated.


        **Note:** If an opportunity has no `title` (empty or whitespace-only), the response returns the parent account''s `title` instead. The stored value is not modified — this is a read-time fallback only.'
      tags:
      - Opportunities
      parameters:
      - name: prop1
        in: query
        description: First field to filter (standard or custom keyName)
        required: true
        schema:
          type: string
      - name: op1
        in: query
        description: Operator for prop1
        required: true
        schema:
          $ref: '#/components/schemas/OpportunitiesSearchGetParametersOp1'
      - name: value1
        in: query
        description: Value for prop1 (comma-separated values for in/nin or between)
        required: true
        schema:
          type: string
      - name: logic
        in: query
        description: Logical combination when both prop1 and prop2 are provided
        required: false
        schema:
          $ref: '#/components/schemas/OpportunitiesSearchGetParametersLogic'
      - name: prop2
        in: query
        description: Optional second field to filter
        required: false
        schema:
          type: string
      - name: op2
        in: query
        description: Operator for prop2
        required: false
        schema:
          $ref: '#/components/schemas/OpportunitiesSearchGetParametersOp2'
      - name: value2
        in: query
        description: Value for prop2 (comma-separated values for in/nin or between)
        required: false
        schema:
          type: string
      - name: page_size
        in: query
        description: Number of items per page (max 100)
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 20
      - name: page
        in: query
        description: Page number (1-based)
        required: false
        schema:
          type: integer
          minimum: 1
          default: 1
      - name: entered_phase_id
        in: query
        description: 'Phase template ID to filter by phase-entry date. Required when `entered_after` or `entered_before` is provided. Given alone (no date bounds), matches records that ever entered this phase.

          '
        required: false
        schema:
          type: integer
      - name: entered_after
        in: query
        description: 'Only include records that entered the phase given by `entered_phase_id` on or after this date/timestamp. Accepts a date (`2026-07-01`) or a full ISO 8601 timestamp (`2026-07-01T00:00:00Z`). Requires `entered_phase_id`.

          '
        required: false
        schema:
          type: string
      - name: entered_before
        in: query
        description: 'Only include records that entered the phase given by `entered_phase_id` before this date/timestamp (exclusive). Accepts a date (`2026-08-01`) or a full ISO 8601 timestamp (`2026-08-01T00:00:00Z`). Requires `entered_phase_id`.

          '
        required: false
        schema:
          type: string
      - name: exited_phase_id
        in: query
        description: 'Phase template ID to filter by phase-exit date. Required when `exited_after` or `exited_before` is provided. Given alone (no date bounds), matches records that have exited this phase at any point.

          '
        required: false
        schema:
          type: integer
      - name: exited_after
        in: query
        description: 'Only include records that exited the phase given by `exited_phase_id` on or after this date/timestamp. Accepts a date (`2026-07-01`) or a full ISO 8601 timestamp (`2026-07-01T00:00:00Z`). Requires `exited_phase_id`.

          '
        required: false
        schema:
          type: string
      - name: exited_before
        in: query
        description: 'Only include records that exited the phase given by `exited_phase_id` before this date/timestamp (exclusive). Accepts a date (`2026-08-01`) or a full ISO 8601 timestamp (`2026-08-01T00:00:00Z`). Requires `exited_phase_id`. On opportunities, combine with `exited_phase_id` set to a "Closed - Won"-style phase template to find deals that closed within a date range.

          '
        required: false
        schema:
          type: string
      - name: order_by
        in: query
        description: Sort order for results
        required: false
        schema:
          $ref: '#/components/schemas/OpportunitiesSearchGetParametersOrderBy'
      - name: include_archived
        in: query
        description: Whether to include archived (inactive) records in the response. By default only active records are returned.
        required: false
        schema:
          type: boolean
          default: false
      - name: include_contacts
        in: query
        description: Whether to include associated contacts in the response. Defaults to false unless explicitly set to true.
        required: false
        schema:
          type: boolean
          default: false
      responses:
        '200':
          description: List of opportunities matching filters
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Opportunity'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SearchOpportunitiesRequestBadRequestError'
        '401':
          description: Authentication failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SearchOpportunitiesRequestUnauthorizedError'
      security:
      - ApiKeyAuth: []
  /opportunities/{opportunity_id}:
    get:
      operationId: opportunities_getOpportunity
      summary: Get Opportunity
      description: 'Retrieve a specific opportunity by ID


        **Note:** The `/requests` path is an alias for `/opportunities` and will continue to work until users are individually notified and migrated.


        **Note:** If the opportunity has no `title` (empty or whitespace-only), the response returns the parent account''s `title` instead. The stored value is not modified — this is a read-time fallback only.'
      tags:
      - Opportunities
      parameters:
      - name: opportunity_id
        in: path
        description: Opportunity identifier
        required: true
        schema:
          type: integer
      - name: include_virtual_properties
        in: query
        description: Whether to include virtual properties in the response. Defaults to false unless explicitly set to true.
        required: false
        schema:
          type: boolean
          default: false
      - name: include_archived
        in: query
        description: Whether to include archived (inactive) records in the response. By default only active records are returned.
        required: false
        schema:
          type: boolean
          default: false
      - name: include_contacts
        in: query
        description: Whether to include associated contacts in the response. Defaults to false unless explicitly set to true.
        required: false
        schema:
          type: boolean
          default: false
      responses:
        '200':
          description: Opportunity details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OpportunityWithPhaseInstances'
        '401':
          description: Authentication failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetOpportunityRequestUnauthorizedError'
        '404':
          description: Resource not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetOpportunityRequestNotFoundError'
      security:
      - ApiKeyAuth: []
    patch:
      operationId: opportunities_updateOpportunity
      summary: Update Opportunity
      description: 'Update an existing opportunity. Supports partial updates.


        Updatable fields:

        - Standard fields (value, size, status, confidence, etc.)

        - Workflow fields (workflowId, phaseId)

        - Contact information (primaryEmail, primaryPhone)

        - Contacts (contact IDs only, no name, email, phone, etc.)

        - Custom fields (through custom object)


        Note: Updates are atomic - either all fields update or none do.


        > **Changing account association is not supported via update.** To move an opportunity to a different account, delete and re-create it under the new account.


        **Note:** The `/requests` path is an alias for `/opportunities` and will continue to work until users are individually notified and migrated.'
      tags:
      - Opportunities
      parameters:
      - name: opportunity_id
        in: path
        description: Opportunity identifier
        required: true
        schema:
          type: integer
      - name: allow_new_options
        in: query
        description: Whether to allow creation of new dropdown options during record creation
        required: false
        schema:
          type: boolean
          default: false
      responses:
        '200':
          description: Opportunity updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Opportunity'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpdateOpportunityRequestBadRequestError'
        '401':
          description: Authentication failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpdateOpportunityRequestUnauthorizedError'
        '404':
          description: Resource not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpdateOpportunityRequestNotFoundError'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OpportunityUpsert'
      security:
      - ApiKeyAuth: []
    delete:
      operationId: opportunities_deleteOpportunity
      summary: Delete Opportunity
      description: 'Delete a specific opportunity by ID


        **Note:** The `/requests` path is an alias for `/opportunities` and will continue to work until users are individually notified and migrated.'
      tags:
      - Opportunities
      parameters:
      - name: opportunity_id
        in: path
        description: Opportunity identifier
        required: true
        schema:
          type: integer
      responses:
        '200':
          description: Successful response
        '401':
          description: Authentication failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeleteOpportunityRequestUnauthorizedError'
        '404':
          description: Resource not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeleteOpportunityRequestNotFoundError'
      security:
      - ApiKeyAuth: []
components:
  schemas:
    GetOpportunityRequestNotFoundError:
      type: object
      properties:
        message:
          type: string
        code:
          $ref: '#/components/schemas/OpportunitiesOpportunityIdGetResponsesContentApplicationJsonSchemaCode'
      title: GetOpportunityRequestNotFoundError
    OpportunityWithPhaseInstancesPhaseInstancesItems:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        status:
          $ref: '#/components/schemas/OpportunityWithPhaseInstancesPhaseInstancesItemsStatus'
        position:
          type: integer
        type:
          type: string
        phaseTemplateId:
          type: integer
        phaseTemplate:
          $ref: '#/components/schemas/PhaseTemplateSummary'
        startedAt:
          type:
          - string
          - 'null'
          format: date-time
          description: Timestamp when the phase instance started
        completedAt:
          type:
          - string
          - 'null'
          format: date-time
          description: Timestamp when the phase instance completed
      title: OpportunityWithPhaseInstancesPhaseInstancesItems
    ListOpportunitiesRequestUnauthorizedError:
      type: object
      properties:
        message:
          type: string
        code:
          $ref: '#/components/schemas/OpportunitiesGetResponsesContentApplicationJsonSchemaCode'
      title: ListOpportunitiesRequestUnauthorizedError
    OpportunityPhaseTimelineItems:
      type: object
      properties:
        phaseTemplateId:
          type: integer
        startedAt:
          type:
          - string
          - 'null'
          format: date-time
          description: Timestamp when the deal entered this phase template
        completedAt:
          type:
          - string
          - 'null'
          format: date-time
          description: Timestamp when the deal exited this phase template
      title: OpportunityPhaseTimelineItems
    SearchOpportunitiesRequestUnauthorizedError:
      type: object
      properties:
        message:
          type: string
        code:
          $ref: '#/components/schemas/OpportunitiesSearchGetResponsesContentApplicationJsonSchemaCode'
      title: SearchOpportunitiesRequestUnauthorizedError
    OpportunitiesGetResponsesContentApplicationJsonSchemaCode:
      type: string
      enum:
      - UNAUTHORIZED
      title: OpportunitiesGetResponsesContentApplicationJsonSchemaCode
    OpportunityOwner:
      type: object
      properties:
        id:
          type: integer
        firstName:
          type: string
        lastName:
          type: string
        email:
          type: string
        phone:
          type:
          - string
          - 'null'
        avatarUrl:
          type:
          - string
          - 'null'
      title: OpportunityOwner
    PhaseTemplateSummary:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        type:
          type: string
        redSla:
          type:
          - integer
          - 'null'
        yellowSla:
          type:
          - integer
          - 'null'
      title: PhaseTemplateSummary
    OpportunitySalesRep:
      type: object
      properties:
        id:
          type: integer
        firstName:
          type: string
        lastName:
          type: string
        email:
          type: string
        phone:
          type:
          - string
          - 'null'
        avatarUrl:
          type:
          - string
          - 'null'
      title: OpportunitySalesRep
    OpportunityUpsert:
      type: object
      properties:
        title:
          type: string
          description: Opportunity title/name
        description:
          type:
          - string
          - 'null'
          description: Opportunity description
        address:
          type: array
          items:
            type: string
          description: An array containing a single string, which represents the full opportunity location/address.
        trades:
          type: array
          items:
            $ref: '#/components/schemas/TradeType'
          description: Array of trade types
        accountId:
          type: integer
          description: ID of associated account. Only accepted on create.
        workflowId:
          type:
          - integer
          - 'null'
          description: ID of associated workflow
        phaseId:
          type:
          - integer
          - 'null'
          description: ID of associated phase template
        ownerId:
          type:
          - integer
          - 'null'
          description: ID of the owning user
        salesRepId:
          type:
          - integer
          - 'null'
          description: ID of the assigned sales rep
        projectManagerId:
          type:
          - integer
          - 'null'
          description: ID of the assigned project manager
        value:
          type: number
          format: double
          description: Project value
        size:
          type: number
          format: double
          description: Project size
        confidence:
          type:
          - number
          - 'null'
          format: double
          description: Deal confidence score (0-100)
        status:
          $ref: '#/components/schemas/OpportunityStatus'
        primaryEmail:
          type: string
          format: email
          description: Primary contact email
        primaryPhone:
          type: string
          description: Primary contact phone
        contacts:
          type: array
          items:
            type: integer
          description: Contact IDs only (no name, email, phone, etc.). The contacts must be created first via POST /contacts. The first ID in the array is treated as the primary contact.
        custom:
          type: object
          additionalProperties:
            description: Any type
          description: Custom fields
      required:
      - title
      - address
      - trades
      description: 'Used for both create and update. `accountId` is only accepted on create — passing it on a PATCH update will return a 400 error.

        '
      title: OpportunityUpsert
    OpportunityStatus:
