openapi: 3.2.0
info:
  title: Reference Contacts API
  version: 1.0.0
servers:
- url: https://api.coperniq.io/v1
  description: Production server
tags:
- name: Contacts
paths:
  /contacts:
    get:
      operationId: contacts_listContacts
      summary: List Contacts
      description: 'Retrieve a paginated list of contacts.


        Supports:

        - Pagination (`page_size`, `page`)

        - Date filtering (`updated_after`, `updated_before`)

        - Sorting (`order_by`)

        - Search (`q`)'
      tags:
      - Contacts
      parameters:
      - name: page_size
        in: query
        description: Number of items per page (max 100)
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 20
      - name: page
        in: query
        description: Page number (1-based)
        required: false
        schema:
          type: integer
          minimum: 1
          default: 1
      - name: updated_after
        in: query
        description: Filter items updated after this timestamp (ISO 8601). Also matches records whose custom property values changed within the window.
        required: false
        schema:
          $ref: '#/components/schemas/ContactsGetParametersUpdatedAfter'
      - name: updated_before
        in: query
        description: Filter items updated before this timestamp (ISO 8601). Also matches records whose custom property values changed within the window.
        required: false
        schema:
          $ref: '#/components/schemas/ContactsGetParametersUpdatedBefore'
      - name: order_by
        in: query
        description: Sort order for results
        required: false
        schema:
          $ref: '#/components/schemas/ContactsGetParametersOrderBy'
      - name: q
        in: query
        description: Full text search across contact name, emails, and phones.
        required: false
        schema:
          type: string
      responses:
        '200':
          description: List of contacts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Contact'
        '401':
          description: Authentication failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListContactsRequestUnauthorizedError'
      security:
      - ApiKeyAuth: []
    post:
      operationId: contacts_createContact
      summary: Create Contact
      description: 'Create a new contact.


        Required fields:

        - `name`: Contact''s full name


        Optional fields:

        - `phones`: Array of contact phone numbers

        - `emails`: Array of contact email addresses

        - `title`: Contact title

        - `accountIds`: Array of account IDs to associate

        - `projectIds`: Array of project IDs to associate'
      tags:
      - Contacts
      responses:
        '201':
          description: Contact created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Contact'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateContactRequestBadRequestError'
        '401':
          description: Authentication failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateContactRequestUnauthorizedError'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ContactCreate'
      security:
      - ApiKeyAuth: []
  /contacts/{contact_id}:
    get:
      operationId: contacts_getContact
      summary: Get Contact
      description: Retrieve a specific contact by ID
      tags:
      - Contacts
      parameters:
      - name: contact_id
        in: path
        description: Contact identifier
        required: true
        schema:
          type: integer
      responses:
        '200':
          description: Contact details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Contact'
        '401':
          description: Authentication failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetContactRequestUnauthorizedError'
        '404':
          description: Resource not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetContactRequestNotFoundError'
      security:
      - ApiKeyAuth: []
    patch:
      operationId: contacts_updateContact
      summary: Update Contact
      description: 'Update an existing contact. Supports partial updates.


        Updatable fields:

        - `name`: Contact''s full name

        - `phones`: Array of contact phone numbers

        - `emails`: Array of contact email addresses

        - `title`: Contact title

        - `accountIds`: Array of account IDs to associate

        - `projectIds`: Array of project IDs to associate'
      tags:
      - Contacts
      parameters:
      - name: contact_id
        in: path
        description: Contact identifier
        required: true
        schema:
          type: integer
      responses:
        '200':
          description: Contact updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Contact'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpdateContactRequestBadRequestError'
        '401':
          description: Authentication failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpdateContactRequestUnauthorizedError'
        '404':
          description: Resource not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpdateContactRequestNotFoundError'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ContactUpdate'
      security:
      - ApiKeyAuth: []
    delete:
      operationId: contacts_deleteContact
      summary: Delete Contact
      description: Delete a specific contact by ID
      tags:
      - Contacts
      parameters:
      - name: contact_id
        in: path
        description: Contact identifier
        required: true
        schema:
          type: integer
      responses:
        '200':
          description: Successful response
        '401':
          description: Authentication failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeleteContactRequestUnauthorizedError'
        '404':
          description: Resource not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeleteContactRequestNotFoundError'
      security:
      - ApiKeyAuth: []
components:
  schemas:
    GetContactRequestNotFoundError:
      type: object
      properties:
        message:
          type: string
        code:
          $ref: '#/components/schemas/ContactsContactIdGetResponsesContentApplicationJsonSchemaCode'
      title: GetContactRequestNotFoundError
    GetContactRequestUnauthorizedError:
      type: object
      properties:
        message:
          type: string
        code:
          $ref: '#/components/schemas/ContactsContactIdGetResponsesContentApplicationJsonSchemaCode'
      title: GetContactRequestUnauthorizedError
    ContactsGetParametersOrderBy:
      type: string
      enum:
      - asc
      - desc
      default: asc
      title: ContactsGetParametersOrderBy
    ContactsContactIdPatchResponsesContentApplicationJsonSchemaCode:
      type: string
      enum:
      - NOT_FOUND
      title: ContactsContactIdPatchResponsesContentApplicationJsonSchemaCode
    ContactsGetParametersUpdatedBefore:
      oneOf:
      - type: string
        format: date
      - type: string
        format: date-time
      title: ContactsGetParametersUpdatedBefore
    UpdateContactRequestBadRequestError:
      type: object
      properties:
        message:
          type: string
        code:
          $ref: '#/components/schemas/ContactsContactIdPatchResponsesContentApplicationJsonSchemaCode'
        field:
          type: string
          description: Field that caused the validation error (if applicable)
      title: UpdateContactRequestBadRequestError
    ContactsContactIdDeleteResponsesContentApplicationJsonSchemaCode:
      type: string
      enum:
      - NOT_FOUND
      title: ContactsContactIdDeleteResponsesContentApplicationJsonSchemaCode
    ContactsGetResponsesContentApplicationJsonSchemaCode:
      type: string
      enum:
      - UNAUTHORIZED
      title: ContactsGetResponsesContentApplicationJsonSchemaCode
    ContactsPostResponsesContentApplicationJsonSchemaCode:
      type: string
      enum:
      - UNAUTHORIZED
      title: ContactsPostResponsesContentApplicationJsonSchemaCode
    ContactCreatedByUser:
      type: object
      properties:
        id:
          type: integer
          description: User identifier
      title: ContactCreatedByUser
    UpdateContactRequestUnauthorizedError:
      type: object
      properties:
        message:
          type: string
        code:
          $ref: '#/components/schemas/ContactsContactIdPatchResponsesContentApplicationJsonSchemaCode'
      title: UpdateContactRequestUnauthorizedError
    ContactsGetParametersUpdatedAfter:
      oneOf:
      - type: string
        format: date
      - type: string
        format: date-time
      title: ContactsGetParametersUpdatedAfter
    CreateContactRequestUnauthorizedError:
      type: object
      properties:
        message:
          type: string
        code:
          $ref: '#/components/schemas/ContactsPostResponsesContentApplicationJsonSchemaCode'
      title: CreateContactRequestUnauthorizedError
    ContactUpdate:
      type: object
      properties:
        name:
          type: string
          description: Contact's full name
        phones:
          type: array
          items:
            type: string
          description: List of contact phone numbers
        emails:
          type: array
          items:
            type: string
          description: List of contact email addresses
        title:
          type: string
          description: Contact title
        accountIds:
          type: array
          items:
            type: integer
          description: Account IDs to associate with the contact
        projectIds:
          type: array
          items:
            type: integer
          description: Project IDs to associate with the contact
      title: ContactUpdate
    DeleteContactRequestNotFoundError:
      type: object
      properties:
        message:
          type: string
        code:
          $ref: '#/components/schemas/ContactsContactIdDeleteResponsesContentApplicationJsonSchemaCode'
      title: DeleteContactRequestNotFoundError
    CreateContactRequestBadRequestError:
      type: object
      properties:
        message:
          type: string
        code:
          $ref: '#/components/schemas/ContactsPostResponsesContentApplicationJsonSchemaCode'
        field:
          type: string
          description: Field that caused the validation error (if applicable)
      title: CreateContactRequestBadRequestError
    ListContactsRequestUnauthorizedError:
      type: object
      properties:
        message:
          type: string
        code:
          $ref: '#/components/schemas/ContactsGetResponsesContentApplicationJsonSchemaCode'
      title: ListContactsRequestUnauthorizedError
    ContactRelatedRecordRef:
      type: object
      properties:
        id:
          type: integer
          description: Record identifier
        title:
          type: string
          description: Record title
      title: ContactRelatedRecordRef
    UpdateContactRequestNotFoundError:
      type: object
      properties:
        message:
          type: string
        code:
          $ref: '#/components/schemas/ContactsContactIdPatchResponsesContentApplicationJsonSchemaCode'
      title: UpdateContactRequestNotFoundError
    DeleteContactRequestUnauthorizedError:
      type: object
      properties:
        message:
          type: string
        code:
          $ref: '#/components/schemas/ContactsContactIdDeleteResponsesContentApplicationJsonSchemaCode'
      title: DeleteContactRequestUnauthorizedError
    Contact:
      type: object
      properties:
        id:
          type: integer
          description: Unique identifier
        createdAt:
          type: string
          format: date-time
          description: Creation timestamp
        updatedAt:
          type: string
          format: date-time
          description: Last update timestamp
        name:
          type: string
          description: Contact's full name
        phones:
          type: array
          items:
            type: string
          description: List of contact phone numbers
        emails:
          type: array
          items:
            type: string
          description: List of contact email addresses
        title:
          type:
          - string
          - 'null'
          description: Contact title
        description:
          type:
          - string
          - 'null'
          description: Contact description
        createdByUser:
          $ref: '#/components/schemas/ContactCreatedByUser'
        accounts:
          type: array
          items:
            $ref: '#/components/schemas/ContactRelatedRecordRef'
          description: List of linked accounts
        projects:
          type: array
          items:
            $ref: '#/components/schemas/ContactRelatedRecordRef'
          description: List of linked projects
        opportunities:
          type: array
          items:
            $ref: '#/components/schemas/ContactRelatedRecordRef'
          description: List of linked opportunities
        vendors:
          type: array
          items:
            $ref: '#/components/schemas/ContactRelatedRecordRef'
          description: List of linked vendors
      required:
      - name
      title: Contact
    ContactsContactIdGetResponsesContentApplicationJsonSchemaCode:
      type: string
      enum:
      - NOT_FOUND
      title: ContactsContactIdGetResponsesContentApplicationJsonSchemaCode
    ContactCreate:
      type: object
      properties:
        name:
          type: string
          description: Contact's full name
        phones:
          type: array
          items:
            type: string
          description: List of contact phone numbers
        emails:
          type: array
          items:
            type: string
          description: List of contact email addresses
        title:
          type: string
          description: Contact title
        accountIds:
          type: array
          items:
            type: integer
          description: Account IDs to associate with the contact
        projectIds:
          type: array
          items:
            type: integer
          description: Project IDs to associate with the contact
      required:
      - name
      title: ContactCreate
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: x-api-key
x-provenance:
  method: harvested
  publisher: Coperniq
  source: https://docs.coperniq.io/openapi/api-reference.yaml
