openapi: 3.2.0
info:
  title: Reference Projects API
  version: 1.0.0
servers:
- url: https://api.coperniq.io/v1
  description: Production server
tags:
- name: Projects
paths:
  /projects:
    get:
      operationId: projects_listProjects
      summary: List Projects
      description: 'Retrieve a paginated list of projects.


        Supports:

        - Pagination (`page_size`, `page`)

        - Date filtering (`updated_after`, `updated_before`, optionally widened to project-level line item edits via `include_line_item_updates`)

        - Phase entry/exit date filtering (`entered_phase_id`+`entered_after`/`entered_before`, `exited_phase_id`+`exited_after`/`exited_before`)

        - Sorting (`order_by`)

        - Field search (`title`, `address`, `primaryName`, `primaryPhone`, `primaryEmail`)

        - Full text search (`q`)


        **Note:** `updated_after`/`updated_before` also match projects whose custom property values changed within the window.


        **Note:** If a project has no `title` (empty or whitespace-only), the response returns the parent account''s `title` instead. The stored value is not modified — this is a read-time fallback only. Title-based search (`title` query param, full-text `q`, or the `/projects/search` endpoint with `prop=title&op=contains`) also matches projects whose own title is null/empty when the parent account''s title matches the search term.


        **Note:** `entered_phase_id`/`exited_phase_id` identify a phase *template* (shared across all projects on a workflow), not a specific phase instance. Use the `phaseTemplateId` from a `GET /projects/{project_id}` response to find the id for a given phase. When either filter is used, each row also includes a compact `phaseTimeline` (`phaseTemplateId`, `startedAt`, `completedAt`); use `GET /projects/{project_id}` for the full `phaseInstances` with names/positions/SLA.'
      tags:
      - Projects
      parameters:
      - name: page_size
        in: query
        description: Number of items per page (max 100)
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 20
      - name: page
        in: query
        description: Page number (1-based)
        required: false
        schema:
          type: integer
          minimum: 1
          default: 1
      - name: updated_after
        in: query
        description: Filter items updated after this timestamp (ISO 8601). Also matches records whose custom property values changed within the window.
        required: false
        schema:
          $ref: '#/components/schemas/ProjectsGetParametersUpdatedAfter'
      - name: updated_before
        in: query
        description: Filter items updated before this timestamp (ISO 8601). Also matches records whose custom property values changed within the window.
        required: false
        schema:
          $ref: '#/components/schemas/ProjectsGetParametersUpdatedBefore'
      - name: include_line_item_updates
        in: query
        description: 'Requires `updated_after` and/or `updated_before` to also be passed — has no effect

          on its own. When true, widens that window to also match projects whose

          project-level line items (estimate/scope items) were added or edited in

          the window, and adds a `lineItemsUpdatedAt` field to each returned project (the most

          recent `updatedAt` among its own scope line items, `null` if none). Line items on

          quotes/invoices are excluded. Deletions and reorders are not detected. Ordering

          remains on the project''s own updatedAt, so this flag is not a replacement for a

          full change-feed. Default: false. Only applies to project list/search endpoints.

          '
        required: false
        schema:
          type: boolean
          default: false
      - name: entered_phase_id
        in: query
        description: 'Phase template ID to filter by phase-entry date. Required when `entered_after` or `entered_before` is provided. Given alone (no date bounds), matches records that ever entered this phase.

          '
        required: false
        schema:
          type: integer
      - name: entered_after
        in: query
        description: 'Only include records that entered the phase given by `entered_phase_id` on or after this date/timestamp. Accepts a date (`2026-07-01`) or a full ISO 8601 timestamp (`2026-07-01T00:00:00Z`). Requires `entered_phase_id`.

          '
        required: false
        schema:
          type: string
      - name: entered_before
        in: query
        description: 'Only include records that entered the phase given by `entered_phase_id` before this date/timestamp (exclusive). Accepts a date (`2026-08-01`) or a full ISO 8601 timestamp (`2026-08-01T00:00:00Z`). Requires `entered_phase_id`.

          '
        required: false
        schema:
          type: string
      - name: exited_phase_id
        in: query
        description: 'Phase template ID to filter by phase-exit date. Required when `exited_after` or `exited_before` is provided. Given alone (no date bounds), matches records that have exited this phase at any point.

          '
        required: false
        schema:
          type: integer
      - name: exited_after
        in: query
        description: 'Only include records that exited the phase given by `exited_phase_id` on or after this date/timestamp. Accepts a date (`2026-07-01`) or a full ISO 8601 timestamp (`2026-07-01T00:00:00Z`). Requires `exited_phase_id`.

          '
        required: false
        schema:
          type: string
      - name: exited_before
        in: query
        description: 'Only include records that exited the phase given by `exited_phase_id` before this date/timestamp (exclusive). Accepts a date (`2026-08-01`) or a full ISO 8601 timestamp (`2026-08-01T00:00:00Z`). Requires `exited_phase_id`. On opportunities, combine with `exited_phase_id` set to a "Closed - Won"-style phase template to find deals that closed within a date range.

          '
        required: false
        schema:
          type: string
      - name: order_by
        in: query
        description: Sort order for results
        required: false
        schema:
          $ref: '#/components/schemas/ProjectsGetParametersOrderBy'
      - name: include_virtual_properties
        in: query
        description: Whether to include virtual properties in the response. Defaults to false unless explicitly set to true.
        required: false
        schema:
          type: boolean
          default: false
      - name: include_archived
        in: query
        description: Whether to include archived (inactive) records in the response. By default only active records are returned.
        required: false
        schema:
          type: boolean
          default: false
      - name: include_contacts
        in: query
        description: Whether to include associated contacts in the response. Defaults to false unless explicitly set to true.
        required: false
        schema:
          type: boolean
          default: false
      - name: q
        in: query
        description: Full text search query
        required: false
        schema:
          type: string
      - name: title
        in: query
        description: Title search query
        required: false
        schema:
          type: string
      - name: address
        in: query
        description: Address search query
        required: false
        schema:
          type: string
      - name: primaryName
        in: query
        description: Contact name search query
        required: false
        schema:
          type: string
      - name: primaryPhone
        in: query
        description: Contact phone search query
        required: false
        schema:
          type: string
      - name: primaryEmail
        in: query
        description: Contact email search query
        required: false
        schema:
          type: string
      responses:
        '200':
          description: List of projects
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Project'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListProjectsRequestBadRequestError'
        '401':
          description: Authentication failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListProjectsRequestUnauthorizedError'
      security:
      - ApiKeyAuth: []
    post:
      operationId: projects_createProject
      summary: Create Project
      description: 'Create a new project with required and optional fields.


        Required fields:

        - `title`: Project title/name

        - `address`: An array containing a single string, which represents the full project location/address.


        Optional fields:

        - `trades`: Array of trade types

        - `accountId`: Link to existing account

        - `workflowId`: Link to workflow

        - `phaseId`: Link to phase

        - `primaryEmail`/`primaryPhone`: Contact information

        - `contacts`: Contact IDs only (no name, email, phone, etc.). The contacts must be created first via POST /contacts.

        - `custom`: Custom fields object


        Note: If primaryEmail or primaryPhone is provided, a contact will be automatically created or matched.'
      tags:
      - Projects
      parameters:
      - name: allow_new_options
        in: query
        description: Whether to allow creation of new dropdown options during record creation
        required: false
        schema:
          type: boolean
          default: false
      - name: match_by
        in: query
        description: Field to use for matching existing records
        required: false
        schema:
          $ref: '#/components/schemas/ProjectsPostParametersMatchBy'
      - name: match_found_strategy
        in: query
        description: Strategy to use when a match is found
        required: false
        schema:
          $ref: '#/components/schemas/ProjectsPostParametersMatchFoundStrategy'
      responses:
        '200':
          description: Matching project found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateProjectRequestBadRequestError'
        '401':
          description: Authentication failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateProjectRequestUnauthorizedError'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProjectCreate'
      security:
      - ApiKeyAuth: []
  /projects/search:
    get:
      operationId: projects_searchProjects
      summary: Search Projects
      description: 'Search projects using up to two filters (prop1/op1/value1 and optionally prop2/op2/value2), combined with `logic` (AND/OR).


        Properties:

        - `propX` can be a standard field (e.g., `status`, `title`, `city`, `type`, `accountId`, etc.) or a custom property key name.

        - Use the `property key` from your company settings.

        - Filter by parent account with `accountId`. `clientId` is accepted as a deprecated alias for backwards compatibility.


        Operators (`opX`):

        - Equality: `eq`, `neq`

        - Numeric/datetime comparisons: `gt`, `gte`, `lt`, `lte`

        - Text/string matching: `contains` (case-insensitive)

        - Lists: `in`, `nin` (CSV list in `valueX`)

        - Ranges: `between` (use `valueX` as `from,to`)

        - Existence: `exists` is not supported for custom properties due to performance limitations. Use `eq` or `neq` instead.

        - `status` has a fixed set of values, so it supports only `eq`, `neq`, `in`, and `nin`.


        Value formats:

        - `in`/`nin`: lists can be provided as:

        - Plain CSV: `value1=OPEN,ACTIVE`

        - Quoted CSV (to include commas inside a value): `value1="Last, First",Other`

        - JSON array: `value1=["Last, First","Other"]`

        - `between`: `from,to` (e.g., `value1=2025-01-01,2025-12-31` or `value1=10,20`)

        - Dates should be ISO 8601 strings; numeric-like values on custom properties are matched against both numeric and text representations.


        Examples:

        - status equals ACTIVE: `?prop1=status&op1=eq&value1=ACTIVE`

        - custom id equals 1234: `?prop1=legacy_tool_project_id&op1=eq&value1=1234`

        - title contains "Solar": `?prop1=name&op1=contains&value1=Solar`

        - status IN (ACTIVE, ON_HOLD) AND city = Austin: `?prop1=status&op1=in&value1=ACTIVE,ON_HOLD&logic=and&prop2=city&op2=eq&value2=Austin`


        **Note:** If a project has no `title` (empty or whitespace-only), the response returns the parent account''s `title` instead. The stored value is not modified — this is a read-time fallback only. Title-based search (`title` query param, full-text `q`, or the `/projects/search` endpoint with `prop=title&op=contains`) also matches projects whose own title is null/empty when the parent account''s title matches the search term.


        Supports date filtering (`updated_after`, `updated_before`), optionally widened to project-level line item edits via `include_line_item_updates`. `updated_after`/`updated_before` also match projects whose custom property values changed within the window.'
      tags:
      - Projects
      parameters:
      - name: prop1
        in: query
        description: First field to filter (standard or custom keyName)
        required: true
        schema:
          type: string
      - name: op1
        in: query
        description: Operator for prop1
        required: true
        schema:
          $ref: '#/components/schemas/ProjectsSearchGetParametersOp1'
      - name: value1
        in: query
        description: Value for prop1 (comma-separated values for in/nin or between)
        required: true
        schema:
          type: string
      - name: logic
        in: query
        description: Logical combination when both prop1 and prop2 are provided
        required: false
        schema:
          $ref: '#/components/schemas/ProjectsSearchGetParametersLogic'
      - name: prop2
        in: query
        description: Optional second field to filter
        required: false
        schema:
          type: string
      - name: op2
        in: query
        description: Operator for prop2
        required: false
        schema:
          $ref: '#/components/schemas/ProjectsSearchGetParametersOp2'
      - name: value2
        in: query
        description: Value for prop2 (comma-separated values for in/nin or between)
        required: false
        schema:
          type: string
      - name: page_size
        in: query
        description: Number of items per page (max 100)
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 20
      - name: page
        in: query
        description: Page number (1-based)
        required: false
        schema:
          type: integer
          minimum: 1
          default: 1
      - name: updated_after
        in: query
        description: Filter items updated after this timestamp (ISO 8601). Also matches records whose custom property values changed within the window.
        required: false
        schema:
          $ref: '#/components/schemas/ProjectsSearchGetParametersUpdatedAfter'
      - name: updated_before
        in: query
        description: Filter items updated before this timestamp (ISO 8601). Also matches records whose custom property values changed within the window.
        required: false
        schema:
          $ref: '#/components/schemas/ProjectsSearchGetParametersUpdatedBefore'
      - name: include_line_item_updates
        in: query
        description: 'Requires `updated_after` and/or `updated_before` to also be passed — has no effect

          on its own. When true, widens that window to also match projects whose

          project-level line items (estimate/scope items) were added or edited in

          the window, and adds a `lineItemsUpdatedAt` field to each returned project (the most

          recent `updatedAt` among its own scope line items, `null` if none). Line items on

          quotes/invoices are excluded. Deletions and reorders are not detected. Ordering

          remains on the project''s own updatedAt, so this flag is not a replacement for a

          full change-feed. Default: false. Only applies to project list/search endpoints.

          '
        required: false
        schema:
          type: boolean
          default: false
      - name: entered_phase_id
        in: query
        description: 'Phase template ID to filter by phase-entry date. Required when `entered_after` or `entered_before` is provided. Given alone (no date bounds), matches records that ever entered this phase.

          '
        required: false
        schema:
          type: integer
      - name: entered_after
        in: query
        description: 'Only include records that entered the phase given by `entered_phase_id` on or after this date/timestamp. Accepts a date (`2026-07-01`) or a full ISO 8601 timestamp (`2026-07-01T00:00:00Z`). Requires `entered_phase_id`.

          '
        required: false
        schema:
          type: string
      - name: entered_before
        in: query
        description: 'Only include records that entered the phase given by `entered_phase_id` before this date/timestamp (exclusive). Accepts a date (`2026-08-01`) or a full ISO 8601 timestamp (`2026-08-01T00:00:00Z`). Requires `entered_phase_id`.

          '
        required: false
        schema:
          type: string
      - name: exited_phase_id
        in: query
        description: 'Phase template ID to filter by phase-exit date. Required when `exited_after` or `exited_before` is provided. Given alone (no date bounds), matches records that have exited this phase at any point.

          '
        required: false
        schema:
          type: integer
      - name: exited_after
        in: query
        description: 'Only include records that exited the phase given by `exited_phase_id` on or after this date/timestamp. Accepts a date (`2026-07-01`) or a full ISO 8601 timestamp (`2026-07-01T00:00:00Z`). Requires `exited_phase_id`.

          '
        required: false
        schema:
          type: string
      - name: exited_before
        in: query
        description: 'Only include records that exited the phase given by `exited_phase_id` before this date/timestamp (exclusive). Accepts a date (`2026-08-01`) or a full ISO 8601 timestamp (`2026-08-01T00:00:00Z`). Requires `exited_phase_id`. On opportunities, combine with `exited_phase_id` set to a "Closed - Won"-style phase template to find deals that closed within a date range.

          '
        required: false
        schema:
          type: string
      - name: order_by
        in: query
        description: Sort order for results
        required: false
        schema:
          $ref: '#/components/schemas/ProjectsSearchGetParametersOrderBy'
      - name: include_archived
        in: query
        description: Whether to include archived (inactive) records in the response. By default only active records are returned.
        required: false
        schema:
          type: boolean
          default: false
      - name: include_contacts
        in: query
        description: Whether to include associated contacts in the response. Defaults to false unless explicitly set to true.
        required: false
        schema:
          type: boolean
          default: false
      responses:
        '200':
          description: List of projects matching filters
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Project'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SearchProjectsRequestBadRequestError'
        '401':
          description: Authentication failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SearchProjectsRequestUnauthorizedError'
      security:
      - ApiKeyAuth: []
  /projects/{project_id}:
    get:
      operationId: projects_getProject
      summary: Get Project
      description: 'Retrieve a specific project by ID.


        **Note:** If the project has no `title` (empty or whitespace-only), the response returns the parent account''s `title` instead. The stored value is not modified — this is a read-time fallback only.'
      tags:
      - Projects
      parameters:
      - name: project_id
        in: path
        description: Project identifier
        required: true
        schema:
          type: integer
      - name: include_virtual_properties
        in: query
        description: Whether to include virtual properties in the response. Defaults to false unless explicitly set to true.
        required: false
        schema:
          type: boolean
          default: false
      - name: include_archived
        in: query
        description: Whether to include archived (inactive) records in the response. By default only active records are returned.
        required: false
        schema:
          type: boolean
          default: false
      - name: include_contacts
        in: query
        description: Whether to include associated contacts in the response. Defaults to false unless explicitly set to true.
        required: false
        schema:
          type: boolean
          default: false
      responses:
        '200':
          description: Project details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectWithPhaseInstances'
        '401':
          description: Authentication failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetProjectRequestUnauthorizedError'
        '404':
          description: Resource not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetProjectRequestNotFoundError'
      security:
      - ApiKeyAuth: []
    patch:
      operationId: projects_updateProject
      summary: Update Project
      description: 'Update an existing project. Supports partial updates.


        Updatable fields:

        - Standard fields (value, size, status, etc.)

        - Workflow fields (workflowId, phaseId)

        - Contact information (primaryEmail, primaryPhone)

        - Contacts (contact IDs only, no name, email, phone, etc.)

        - Custom fields (through custom object)


        Note: Updates are atomic - either all fields update or none do.


        > **Changing account association is not supported via update.** To move a project to a different account, delete and re-create it under the new account.'
      tags:
      - Projects
      parameters:
      - name: project_id
        in: path
        description: Project identifier
        required: true
        schema:
          type: integer
      - name: allow_new_options
        in: query
        description: Whether to allow creation of new dropdown options during record creation
        required: false
        schema:
          type: boolean
          default: false
      responses:
        '200':
          description: Project updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpdateProjectRequestBadRequestError'
        '401':
          description: Authentication failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpdateProjectRequestUnauthorizedError'
        '404':
          description: Resource not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpdateProjectRequestNotFoundError'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProjectUpdate'
      security:
      - ApiKeyAuth: []
    delete:
      operationId: projects_deleteProject
      summary: Delete Project
      description: Delete a specific project by ID
      tags:
      - Projects
      parameters:
      - name: project_id
        in: path
        description: Project identifier
        required: true
        schema:
          type: integer
      responses:
        '200':
          description: Successful response
        '401':
          description: Authentication failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeleteProjectRequestUnauthorizedError'
        '404':
          description: Resource not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeleteProjectRequestNotFoundError'
      security:
      - ApiKeyAuth: []
components:
  schemas:
    UpdateProjectRequestBadRequestError:
      type: object
      properties:
        message:
          type: string
        code:
          $ref: '#/components/schemas/ProjectsProjectIdPatchResponsesContentApplicationJsonSchemaCode'
        field:
          type: string
          description: Field that caused the validation error (if applicable)
      title: UpdateProjectRequestBadRequestError
    ProjectsSearchGetParametersUpdatedBefore:
      oneOf:
      - type: string
        format: date
      - type: string
        format: date-time
      title: ProjectsSearchGetParametersUpdatedBefore
    ProjectsSearchGetParametersLogic:
      type: string
      enum:
      - and
      - or
      default: and
      title: ProjectsSearchGetParametersLogic
    SearchProjectsRequestBadRequestError:
      type: object
      properties:
        message:
          type: string
        code:
          $ref: '#/components/schemas/ProjectsSearchGetResponsesContentApplicationJsonSchemaCode'
        field:
          type: string
          description: Field that caused the validation error (if applicable)
      title: SearchProjectsRequestBadRequestError
    ProjectsSearchGetResponsesContentApplicationJsonSchemaCode:
      type: string
      enum:
      - UNAUTHORIZED
      title: ProjectsSearchGetResponsesContentApplicationJsonSchemaCode
    PhaseTemplateSummary:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        type:
          type: string
        redSla:
          type:
          - integer
          - 'null'
        yellowSla:
          type:
          - integer
          - 'null'
      title: PhaseTemplateSummary
    ProjectsSearchGetParametersOrderBy:
      type: string
      enum:
      - asc
      - desc
      default: asc
      title: ProjectsSearchGetParametersOrderBy
    ProjectWithPhaseInstancesStage:
      type: object
      properties:
        id:
          type: integer
          description: Stage identifier
        name:
          type: string
          description: Stage name
        type:
          type: string
          description: Stage type
        scope:
          type: string
          description: Stage scope
        redSla:
          type: integer
          description: Red SLA threshold in days
        yellowSla:
          type: integer
          description: Yellow SLA threshold in days
        timeInStageDays:
          type: integer
          description: Number of days in current stage
        slaStatus:
          $ref: '#/components/schemas/ProjectWithPhaseInstancesStageSlaStatus'
          description: Current SLA violation status
      description: 'Current stage information (Workflows 1.0).


        This object is present only for records still using the original Stage-based workflow engine.

        When the project is managed by Workflows 2.0 (Phase engine) the `stage` object and

        related fields (`stageId`, `timeInStageDays`, `slaStatus`) are omitted.

        '
      title: ProjectWithPhaseInstancesStage
    ProjectsProjectIdPatchResponsesContentApplicationJsonSchemaCode:
      type: string
      enum:
      - NOT_FOUND
      title: ProjectsProjectIdPatchResponsesContentApplicationJsonSchemaCode
    GetProjectRequestUnauthorizedError:
      type: object
      properties:
        message:
          type: string
        code:
          $ref: '#/components/schemas/ProjectsProjectIdGetResponsesContentApplicationJsonSchemaCode'
      title: GetProjectRequestUnauthorizedError
    UpdateProjectRequestNotFoundError:
      type: object
      properties:
        message:
          type: string
        code:
          $ref: '#/components/schemas/ProjectsProjectIdPatchResponsesContentApplicationJsonSchemaCode'
      title: UpdateProjectRequestNotFoundError
    ProjectsSearchGetParametersOp2:
      type: string
      enum:
      - eq
      - neq
      - gt
      - gte
      - lt
      - lte
      - contains
      - in
      - nin
      - between
      title: ProjectsSearchGetParametersOp2
    ProjectStage:
      type: object
      properties:
        id:
          type: integer
          description: Stage identifier
        name:
          type: string
          description: Stage name
        type:
          type: string
          description: Stage type
        scope:
          type: string
          description: Stage scope
        redSla:
          type: integer
          description: Red SLA threshold in days
