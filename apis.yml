aid: coperniq
name: Coperniq
description: >-
  Coperniq is an AI-powered operating system for residential and commercial contractors across
  solar, storage, HVAC, electrical, plumbing, and roofing trades, consolidating sales, project
  management, service operations, dispatch, and cashflow into one system. Its REST API
  (https://api.coperniq.io/v1) lets developers automate projects, opportunities, accounts,
  contacts, sites, assets, work orders, forms, quotes, invoices, bills, payments, and more, with
  API-key authentication, page-based pagination, per-key rate limiting, and outbound automation
  webhooks. Coperniq was surfaced as a portfolio company of Initialized Capital (sector: climate)
  and enriched into the API Evangelist network from its public developer surface.
